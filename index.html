<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>SpendSim Ultimate</title>
<style>
/* Design plan: deep-space "fintech casino" look. Ink on night, violet accent, lime for gains, coral for losses.
   Layout: sticky balance HUD over a tabbed store grid, with a full-screen canvas for spectacle. */
:root{
  --bg:#eef1f6;--card:#ffffff;--ink:#101523;--mut:#667089;--line:#dde2ee;
  --acc:#5b3df5;--ok:#0fa968;--bad:#e5383b;--warn:#f59e0b;--hd:#ffffffee;
  box-sizing:border-box;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#080b14;--card:#121829;--ink:#eef1fb;--mut:#8a93b0;--line:#222a44;--acc:#8d78ff;--ok:#2be08f;--bad:#ff5c5f;--warn:#fbbf24;--hd:#0c1020ee;color-scheme:dark}
}
:root[data-theme=dark]{--bg:#080b14;--card:#121829;--ink:#eef1fb;--mut:#8a93b0;--line:#222a44;--acc:#8d78ff;--ok:#2be08f;--bad:#ff5c5f;--warn:#fbbf24;--hd:#0c1020ee;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;overflow-x:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input[type=search],input[type=text],input[type=number]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}

/* HUD */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);backdrop-filter:blur(14px);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.bal small{color:var(--mut);display:flex;align-items:center;gap:6px;font-weight:600}
#bal{font-size:clamp(26px,6.5vw,44px);font-weight:800;font-variant-numeric:tabular-nums;color:var(--ok);letter-spacing:-.02em;transition:color .2s}
#bal.hit{color:var(--bad);animation:jolt .4s}
#bal.gain{color:var(--ok);animation:pulseOk .5s}
.meter{height:6px;border-radius:9px;background:var(--line);margin-top:4px;overflow:hidden;min-width:210px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),#ffb020,var(--ok));transition:width .9s cubic-bezier(.2,.8,.2,1)}
#st{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
#st span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:600;white-space:nowrap}
.fl{position:fixed;left:16px;top:88px;font-weight:800;font-size:20px;color:var(--bad);animation:up 1.6s forwards;pointer-events:none;z-index:12}
.fl.g{color:var(--ok)}

/* Layout */
main{max-width:1160px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px));min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tabs button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;transition:transform .12s}
.tabs button:active{transform:scale(.96)}
.tabs .on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs #rs{margin-left:auto;color:var(--mut)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.chips .on{background:var(--ink);color:var(--bg)}
.sec-h{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}

/* Store grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:10px}
.co{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative}
.co:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 8px 20px #00000012}
.lg{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;margin-bottom:8px}
.co b{display:block;font-size:15px}
.co small{color:var(--mut);font-size:12px}

/* Layers and sheets */
.layer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));background:#04060dd9;backdrop-filter:blur(7px)}
.layer.on{display:flex}
#ov{z-index:20}#ck{z-index:30}#lay{z-index:40}
#fxc{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px;width:100%;max-width:480px;max-height:100%;overflow:auto;animation:pop .28s cubic-bezier(.2,1.35,.4,1)}
.sh{padding:18px;color:#fff;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2}
.sh i{font-style:normal;font-size:34px}
.sh button{margin-left:auto;font-size:22px;color:#fff;width:34px;height:34px;border-radius:50%;background:#0003;display:grid;place-items:center}
.row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.row>span:first-child{font-size:26px;flex-shrink:0}
.row div{flex:1;min-width:0}
.row small{color:var(--mut);display:block;font-size:12.5px}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;margin-top:3px;margin-right:4px}
.badge.inc{background:#0fa96822;color:var(--ok)}
.badge.upk{background:#e5383b22;color:var(--bad)}
.badge.per{background:#5b3df522;color:var(--acc)}
.buy{background:var(--acc);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;white-space:nowrap;transition:transform .1s}
.buy:active{transform:scale(.95)}
.buy:disabled{opacity:.45}
.ghost{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;background:var(--card);white-space:nowrap}
.ghost:disabled{opacity:.4}
.good{color:var(--ok)}.bad{color:var(--bad)}

/* Checkout + 5 card styles */
.ckb{padding:18px}
.ckb h3{margin:0 0 2px}
.qty{display:flex;gap:6px;margin:10px 0;align-items:center;flex-wrap:wrap}
.qty button{border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-weight:600}
.qty b{min-width:56px;text-align:center}
.card-styles{display:flex;gap:5px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.card-styles::-webkit-scrollbar{display:none}
.card-styles button{font-size:11.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);white-space:nowrap;font-weight:700;color:var(--mut)}
.card-styles button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card-stage{perspective:1000px;margin:10px 0 14px;position:relative;height:164px}
.card{height:164px;border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#1b2a6b,#6a2fd8 60%,#d6357f);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;font-family:ui-monospace,monospace;letter-spacing:.08em;box-shadow:0 12px 28px #00000033;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.9,.3,1.1),box-shadow .4s}
.card-top{display:flex;justify-content:space-between;align-items:center;z-index:2}
.chip{width:40px;height:28px;border-radius:6px;background:linear-gradient(135deg,#f6d98a,#b98d2e);position:relative;overflow:hidden}
.chip::after{content:"";position:absolute;inset:6px;border:1px solid #0003;border-radius:3px}
.card-mid{z-index:2;font-size:17px;font-weight:700;text-shadow:0 2px 6px #0004}
.card-bot{display:flex;justify-content:space-between;align-items:flex-end;z-index:2;font-size:12px}
.card.s0.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,#ffffff88 50%,transparent 75%);animation:sweep .85s infinite}
.card.s1{background:linear-gradient(135deg,#0f172a,#1e3a8a 55%,#0284c7)}
.card-back{position:absolute;inset:0;background:linear-gradient(135deg,#090d16,#1e293b);border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;backface-visibility:hidden;transform:rotateY(180deg);z-index:3}
.magstripe{height:34px;background:#000;margin:4px -18px}
.cvv-bar{background:#fff;color:#111;padding:6px 10px;border-radius:6px;display:flex;justify-content:space-between;font-weight:800;font-size:13px}
.laser-beam{position:absolute;left:0;right:0;height:3px;background:#38bdf8;box-shadow:0 0 14px 4px #38bdf8,0 0 24px #fff;top:20%;opacity:0;z-index:4}
.card.s1.busy{transform:rotateY(180deg)}
.card.s1.busy .laser-beam{opacity:1;animation:laserScan .9s ease-in-out infinite alternate}
.card.s2{background:linear-gradient(135deg,#064e3b,#059669 55%,#10b981)}
.nfc-zone{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4;opacity:0}
.nfc-ring{position:absolute;width:60px;height:60px;border-radius:50%;border:3px solid #6ee7b7;opacity:0}
.card.s2.busy{transform:perspective(700px) rotateX(24deg) scale(.94) translateY(8px);box-shadow:0 22px 40px #10b98166}
.card.s2.busy .nfc-zone{opacity:1}
.card.s2.busy .nfc-ring:nth-child(1){animation:nfcWave 1.2s ease-out infinite}
.card.s2.busy .nfc-ring:nth-child(2){animation:nfcWave 1.2s ease-out .4s infinite}
.card.s2.busy .nfc-ring:nth-child(3){animation:nfcWave 1.2s ease-out .8s infinite}
.card.s3{background:radial-gradient(circle at 20% 20%,#3f3f46,#18181b 60%,#09090b);border:1px solid #52525b}
.obsidian-glint{position:absolute;inset:-50%;background:linear-gradient(45deg,transparent 42%,#ffffff33 50%,transparent 58%);transform:translateX(-100%);z-index:3}
.card.s3.busy{animation:metalSlam .7s cubic-bezier(.3,1.6,.4,1) forwards}
.card.s3.busy .obsidian-glint{animation:glintRun 1s ease-in-out infinite}
.card.s4{background:linear-gradient(125deg,#ff0080,#7928ca,#0070f3,#00dfd8,#ff0080);background-size:300% 300%;animation:holoShift 4s ease infinite}
.bio-scan{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:2px dashed #fff9;display:grid;place-items:center;font-size:24px;z-index:4;background:#0004}
.bio-line{position:absolute;left:6px;right:6px;height:2px;background:#2be08f;box-shadow:0 0 8px #2be08f;top:10%;opacity:0}
.card.s4.busy{transform:rotateY(-12deg) rotateX(8deg) scale(1.03)}
.card.s4.busy .bio-scan{border-color:#2be08f;box-shadow:0 0 20px #2be08f88}
.card.s4.busy .bio-line{opacity:1;animation:bioSweep .75s ease-in-out infinite alternate}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800}
.stat{min-height:22px;color:var(--mut);margin:8px 0;font-weight:600}
.pay{width:100%;padding:14px;border-radius:14px;background:var(--ok);color:#04150d;font-weight:800;font-size:17px;transition:transform .1s}
.pay:active{transform:scale(.98)}
.pay:disabled{opacity:.6}
.res{padding:30px 20px;text-align:center}
.res h2{margin:14px 0 4px}
.res p{color:var(--mut);margin:3px 0}
.res.no{animation:shake .5s}
.res svg{width:92px;height:92px}
.res circle{fill:none;stroke-width:5;stroke-dasharray:190;stroke-dashoffset:190;animation:draw .6s forwards}
.res path{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .5s forwards}
.res.ok svg{stroke:var(--ok)}
.res.no svg{stroke:var(--bad)}

/* Live studio (TikTok / YouTube / Twitch / other) */
.tt-live{width:100%;max-width:420px;height:min(86vh,740px);border-radius:26px;overflow:hidden;background:#09090f;color:#fff;position:relative;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 24px 60px #000a;border:1px solid #ffffff22;animation:pop .32s cubic-bezier(.2,1.3,.4,1)}
.tt-live.yt-mode{max-width:520px;background:#0f0f0f;border-color:#ff000044}
.tt-live.tw-mode{max-width:460px;background:#0e0e10;border-color:#9146ff55}
.tt-stage{position:absolute;inset:0;background:radial-gradient(circle at 50% 32%,#ff2c5555,#4f46e544 45%,#09090f 85%);background-size:200% 200%;animation:bg 5s ease infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.yt-mode .tt-stage{background:radial-gradient(circle at 50% 28%,#ff000044,#28282866 48%,#0f0f0f 86%)}
.tw-mode .tt-stage{background:radial-gradient(circle at 50% 30%,#9146ff55,#1f1f2366 48%,#0e0e10 86%)}
.tt-avatar-ring{width:136px;height:136px;border-radius:50%;padding:5px;background:linear-gradient(45deg,#ff2c55,#00f2fe,#ff2c55);animation:spinSlow 4s linear infinite;display:grid;place-items:center;box-shadow:0 0 40px #ff2c5566}
.yt-mode .tt-avatar-ring{background:linear-gradient(45deg,#ff0000,#ff8a00,#ff0000)}
.tw-mode .tt-avatar-ring{background:linear-gradient(45deg,#9146ff,#00f5d4,#9146ff)}
.tt-avatar{width:100%;height:100%;border-radius:50%;background:#13131f;display:grid;place-items:center;font-size:68px;animation:spinSlowReverse 4s linear infinite}
.tt-eq{display:flex;gap:4px;height:22px;align-items:flex-end;margin-top:12px}
.tt-eq i{width:4px;background:#00f2fe;border-radius:4px;animation:eqBar .45s ease-in-out infinite alternate}
.tt-eq i:nth-child(2){animation-delay:.12s;background:#ff2c55}
.tt-eq i:nth-child(3){animation-delay:.24s}
.tt-eq i:nth-child(4){animation-delay:.08s;background:#ff2c55}
.tt-eq i:nth-child(5){animation-delay:.3s}
.tt-top{position:relative;z-index:3;padding:12px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(#000b,transparent)}
.tt-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tt-creator{display:flex;align-items:center;gap:8px;background:#0007;backdrop-filter:blur(8px);padding:4px 10px 4px 5px;border-radius:99px;border:1px solid #ffffff1a}
.tt-creator .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff2c55,#7928ca);display:grid;place-items:center;font-size:18px}
.yt-mode .tt-creator .av{background:linear-gradient(135deg,#ff0000,#991b1b)}
.tw-mode .tt-creator .av{background:linear-gradient(135deg,#9146ff,#4c1d95)}
.tt-creator div{line-height:1.15}
.tt-creator b{font-size:12.5px;display:block}
.tt-creator small{font-size:10.5px;color:#cbd5e1}
.tt-follow{background:#fe2c55;color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px}
.yt-mode .tt-follow{background:#ff0000}
.tw-mode .tt-follow{background:#9146ff}
.tt-stats{display:flex;align-items:center;gap:6px}
.tt-pill{background:#0007;backdrop-filter:blur(8px);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.tt-live-tag{background:#fe2c55;padding:3px 7px;border-radius:6px;font-size:10.5px;font-weight:900;letter-spacing:.04em}
.yt-mode .tt-live-tag{background:#ff0000}
.tw-mode .tt-live-tag{background:#9146ff}
.tt-close{width:30px;height:30px;border-radius:50%;background:#0007;color:#fff;display:grid;place-items:center;font-size:16px}
.tt-pk{background:#0008;border-radius:99px;padding:3px;border:1px solid #ffffff22}
.tt-pk-labels{display:flex;justify-content:space-between;font-size:11px;font-weight:800;padding:0 8px 3px}
.tt-pk-track{height:10px;border-radius:99px;background:#2563eb;overflow:hidden;display:flex}
.tt-pk-fill{height:100%;background:linear-gradient(90deg,#fe2c55,#f59e0b);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.yt-mode .tt-pk-track{background:#27272a}
.yt-mode .tt-pk-fill{background:linear-gradient(90deg,#ff0000,#f59e0b,#fde047)}
.tw-mode .tt-pk-track{background:#26262c}
.tw-mode .tt-pk-fill{background:linear-gradient(90deg,#9146ff,#ec4899,#00f5d4)}
.tt-vip{align-self:flex-start;background:linear-gradient(90deg,#f59e0b,#eab308);color:#111;font-size:11.5px;font-weight:900;padding:4px 10px;border-radius:99px;box-shadow:0 4px 12px #f59e0b55}
.yt-ticker{display:flex;gap:6px;overflow:hidden;padding:2px 0}
.yt-chip{padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 3px 10px #0006;animation:pop .3s}
.tt-gift-combo{position:relative;z-index:4;margin:4px 12px;background:linear-gradient(90deg,#fe2c55dd,#7c3aedcc,transparent);border-radius:99px;padding:6px 14px;display:flex;align-items:center;gap:10px;animation:slideInLeft .4s cubic-bezier(.2,1.4,.4,1)}
.yt-mode .tt-gift-combo{background:linear-gradient(90deg,#ff0000dd,#b91c1ccc,transparent)}
.tw-mode .tt-gift-combo{background:linear-gradient(90deg,#9146ffdd,#4f46e5cc,transparent)}
.tt-gift-combo .gi{font-size:34px;animation:bob .5s infinite alternate}
.tt-gift-combo .gx{font-size:24px;font-weight:900;font-style:italic;color:#fde047;text-shadow:0 2px 10px #000}
.tt-bot{position:relative;z-index:3;padding:10px 12px 14px;background:linear-gradient(transparent,#000d 45%,#000)}
.tt-sc-pin{margin-bottom:8px;border-radius:14px;overflow:hidden;background:var(--c,#e62117);animation:drop .5s cubic-bezier(.2,1.4,.4,1);box-shadow:0 8px 24px #0008}
.tt-sc-pin .hd{padding:7px 12px;font-weight:800;font-size:13px;display:flex;justify-content:space-between}
.tt-sc-pin .bd{padding:7px 12px;background:#0004;font-size:13.5px;font-weight:600}
.tt-sc-pin u{display:block;height:3px;background:#fff;animation:bar 7s linear forwards;transform-origin:left}
.tt-chat{height:165px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;mask-image:linear-gradient(transparent,#000 22%)}
.tt-msg{background:#0006;backdrop-filter:blur(4px);padding:5px 10px;border-radius:14px;font-size:12.5px;line-height:1.3;animation:msgPop .22s ease-out;align-self:flex-start;max-width:100%}
.tt-badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:800;margin-right:4px;vertical-align:middle}
.tt-rx{margin-top:8px;background:#ffffff14;border:1px solid #ffffff22;border-radius:12px;padding:8px 12px;font-size:13px;font-style:italic;color:#f8fafc;min-height:38px}
.tt-actions{display:flex;gap:8px;margin-top:10px;align-items:center}
.tt-fake-in{flex:1;background:#ffffff18;border-radius:99px;padding:8px 14px;font-size:12.5px;color:#cbd5e1;text-align:left}
.tt-heart-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#fe2c55,#ff6b8b);color:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 4px 16px #fe2c5588;transition:transform .1s}
.tt-heart-btn:active{transform:scale(.85)}
.tt-fountain{position:absolute;right:14px;bottom:70px;width:50px;height:260px;pointer-events:none;z-index:4}
.tt-fheart{position:absolute;bottom:0;right:10px;font-size:24px;animation:floatHeart 2.2s ease-out forwards}

/* Ad simulator */
.ad-phone{width:100%;max-width:410px;border-radius:28px;overflow:hidden;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 24px 60px #0008;animation:pop .3s}
.ad-hdr{padding:14px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between;font-weight:800;gap:8px}
.ad-post{margin:12px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg)}
.ad-user{padding:10px 12px;display:flex;align-items:center;gap:9px}
.ad-user .uav{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800}
.ad-media{height:140px;display:grid;place-items:center;font-size:64px;position:relative;color:#fff}
.ad-media span{position:absolute;bottom:8px;right:10px;background:#0008;color:#fff;font-size:11px;padding:3px 8px;border-radius:99px;font-weight:700}
.ad-eng{padding:10px 12px;display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px}
.cnt div{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center;border:1px solid var(--line)}
.cnt b{display:block;font-size:18px;font-variant-numeric:tabular-nums;color:var(--acc)}
.cnt small{color:var(--mut);font-size:11.5px}
.pb{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:0 12px}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));animation:grow 3.2s ease-out forwards}

/* Receipts, inventory, presets */
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;min-width:0}
.rec div{flex:1;min-width:0}
.rec small{color:var(--mut);display:block;font-size:12.5px}
.rec b{color:var(--bad)}
.sell-btn{background:#f59e0b22;color:var(--warn);border:1px solid #f59e0b55;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.empty{color:var(--mut);padding:30px;text-align:center}
.preset-grid{display:grid;gap:8px;margin-top:14px}
.preset-btn{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:left;display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}
.preset-btn:hover{border-color:var(--acc);background:var(--card)}
.spark{width:100%;height:56px;display:block}
.stock-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.stock-row>div{flex:1;min-width:0}
.stock-row small{color:var(--mut);font-size:12px;display:block}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.qbtns button{border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-weight:700;font-size:12.5px;background:var(--bg)}

#tt{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
#tt div{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;animation:pop .3s,fade 3.4s forwards;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px #0004;text-align:center}
.shake{animation:shake .6s}

@keyframes pop{from{transform:scale(.85);opacity:0}}
@keyframes up{to{transform:translateY(-36px);opacity:0}}
@keyframes jolt{30%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
@keyframes pulseOk{40%{transform:scale(1.04)}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes laserScan{from{top:14%}to{top:82%}}
@keyframes nfcWave{0%{transform:scale(.4);opacity:.95}100%{transform:scale(3.6);opacity:0}}
@keyframes metalSlam{0%{transform:translateY(-40px) scale(1.12)}45%{transform:translateY(6px) scale(.96)}70%{transform:translateY(-3px) scale(1.01)}100%{transform:translateY(0) scale(1)}}
@keyframes glintRun{from{transform:translateX(-100%)}to{transform:translateX(160%)}}
@keyframes holoShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes bioSweep{from{top:14%}to{top:82%}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes bg{50%{background-position:100% 50%}}
@keyframes bob{to{transform:translateY(-10px) rotate(6deg)}}
@keyframes drop{from{transform:translateY(-90px) scale(.8);opacity:0}}
@keyframes bar{to{transform:scaleX(0)}}
@keyframes fade{to{opacity:0}}
@keyframes grow{to{width:100%}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes spinSlowReverse{to{transform:rotate(-360deg)}}
@keyframes eqBar{from{height:4px}to{height:22px}}
@keyframes slideInLeft{from{transform:translateX(-110%);opacity:0}}
@keyframes msgPop{from{transform:translateY(10px);opacity:0}}
@keyframes floatHeart{0%{transform:translate(0,0) scale(.6);opacity:1}50%{transform:translate(-18px,-120px) scale(1.1);opacity:.9}100%{transform:translate(14px,-240px) scale(.8);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

// Startup rounds resolve every 60s on live cycles
function startupRound(){
  S.biz.forEach(b=>{ if(b.kind!='startup'||b.dead)return;
    const r=Math.random();
    if(r<b.win){ b.val*=rnd(1.3,1.25+b.mult[1]/10); b.wins=(b.wins||0)+1; b.notes='📈 Series round closed up!'; }
    else if(r<b.win+.25){ b.val*=rnd(.35,.85); b.notes='📉 Burned cash, valuation trimmed'; }
    else{ b.dead=true; b.val=0; b.notes='💥 Company shut down'; }
  });
}

// ---------- Net worth & cashflow ----------
function portfolioValue(){
  let v=0;
  for(const t in S.stk){const x=tickerOf(t);if(x)v+=x.p*S.stk[t].q}
  return v;
}
function propValue(){return S.prop.reduce((a,p)=>a+p.value,0)}
function bizValue(){return S.biz.reduce((a,b)=>a+(b.dead?0:b.kind=='startup'?b.val:b.val||0),0)}
function getNetWorth(){
  let assets=0;
  for(const k in S.inv){
    const[,it]=ITM(k);
    if(it&&!/[mshag]/.test(it.f))assets+=it.p*S.inv[k]*.7;
  }
  return S.bal+assets+portfolioValue()+propValue()+bizValue();
}
function getCycleNet(){
  let net=0;
  for(const k in S.subs){const[,it]=ITM(k);if(it)net-=it.p}
  for(const k in S.inv){const[,it]=ITM(k);if(it&&it.cf)net+=it.cf*S.inv[k]}
  S.prop.forEach(p=>{net+=p.rent-p.tax});
  S.biz.forEach(b=>{if(!b.dead&&b.kind!='startup')net+=b.income*(1+(b.staff||0)*.15)-b.upkeep-(b.staff||0)*b.staffPay});
  return net;
}

// ---------- Balance & HUD ----------
function setBal(dir=0){
  cancelAnimationFrame(raf);
  const f=shown,to=S.bal,t0=performance.now();
  if(dir<0){$('#bal').classList.add('hit');setTimeout(()=>$('#bal').classList.remove('hit'),900)}
  if(dir>0){$('#bal').classList.add('gain');setTimeout(()=>$('#bal').classList.remove('gain'),900)}
  (function s(t){
    const k=Math.min(1,(t-t0)/850);
    shown=f+(to-f)*(1-Math.pow(1-k,3));
    $('#bal').textContent=fmt(shown);
    if(k<1)raf=requestAnimationFrame(s);
  })(t0);
  $('#mt').style.width=clamp(S.bal/S.start*100,0,100)+'%';
  $('#modeLabel').textContent=`Cash · CAD (Start ${fmt(S.start)})`;
  stats();save();
}
function stats(){
  const net=getCycleNet(),
        r=RANKS.filter(x=>getNetWorth()>=x[0]).pop()[1],
        sec=Math.max(0,Math.ceil((next-Date.now())/1000)),
        netStr=net===0?'$0/20s':(net>0?`+${fmt(net)}/20s`:`−${fmt(Math.abs(net))}/20s`);
  $('#st').innerHTML=`
    <span>🏅 ${S.bal<1&&getNetWorth()<10?'Broke legend':r}</span>
    <span>🏦 Net Worth ${fmt(getNetWorth())}</span>
    <span>😊 ${Math.round(S.h)}</span>
    <span>📣 ${Math.round(S.c)}</span>
    <span>💖 ${Math.round(S.k+S.karma)}</span>

}

// ---------- Commit a purchase ----------
function commit(c,it,i,q,tot,msg){
  S.bal=+(S.bal-tot).toFixed(2);
  S.spent+=tot;
  const k=c.id+'.'+i;
  S.inv[k]=(S.inv[k]||0)+q;
  if(it.f=='m')S.subs[k]=1;
  const d=Math.log10(tot+1)*3,ct=c.cat;
  if(ct=='Charity'){S.k+=d;S.karma+=d}
  else if(['Social','Luxury','Cars','Space','Sports'].includes(ct)||it.f=='a'){S.c+=d;S.h+=d/2}
  else S.h+=d;
  S.xp+=Math.round(Math.log10(tot+10)*10);
  S.rec.unshift({e:it.e,n:it.n,s:c.n,q,tot,t:Date.now(),d:/[gsamh]/.test(it.f)});
  S.rec=S.rec.slice(0,150);
  setBal(-1);flt('−'+fmt(tot));sfxDing(260,.2,'triangle');
  if(it.f=='s'||it.f=='h'||it.f=='g')openLiveStudio(c,it,q,tot,msg);
  else if(it.f=='a')openViralAdSim(c,it,tot);
  else celebrate(c,it,q,tot);
  if(openCo)openStore(openCo);
  renderTabs();
  if(S.bal<1&&getNetWorth()<10)setTimeout(broke,2400);
}

// ---------- Billing cycle: every 20s ----------
setInterval(()=>{
  if(Date.now()>=next){
    next=Date.now()+20000;
    let delta=0;
    Object.keys(S.subs).forEach(k=>{
      const[c,it]=ITM(k);
      if(S.bal<it.p){delete S.subs[k];toast(`⚠️ ${it.n} cancelled: insufficient funds`);return}
      S.bal=+(S.bal-it.p).toFixed(2);S.spent+=it.p;delta-=it.p;
      S.rec.unshift({e:'🔁',n:'Sub: '+it.n,s:c.n,q:1,tot:it.p,t:Date.now(),d:1});
    });
    let passive=0,upkeep=0;
    Object.keys(S.inv).forEach(k=>{
      const[,it]=ITM(k);
      if(it&&it.cf){const amt=it.cf*S.inv[k];if(amt>0)passive+=amt;else upkeep+=Math.abs(amt)}
    });
    S.prop.forEach(p=>{passive+=p.rent;upkeep+=p.tax;p.value*=1+propOf(p.pid).apprec});
    S.biz.forEach(b=>{if(b.dead||b.kind=='startup')return;const inc=b.income*(1+(b.staff||0)*.15);passive+=inc;upkeep+=b.upkeep+(b.staff||0)*b.staffPay});
    if(passive>0){S.bal=+(S.bal+passive).toFixed(2);delta+=passive;S.rec.unshift({e:'📈',n:'Passive income & rent',s:'Portfolio',q:1,tot:-passive,t:Date.now(),d:1})}
    if(upkeep>0){const payUp=Math.min(S.bal,upkeep);S.bal=+(S.bal-payUp).toFixed(2);S.spent+=payUp;delta-=payUp;
      if(payUp>0)S.rec.unshift({e:'🧾',n:'Upkeep, taxes & payroll',s:'Operations',q:1,tot:payUp,t:Date.now(),d:1})}
    if(delta!==0){
      setBal(delta>0?1:-1);
      flt((delta>0?'+':'−')+fmt(Math.abs(delta)),delta>0);
      sfxDing(delta>0?660:330,.1);
      renderTabs();
    }
    save();
  }
  stats();
  if(tab!='s'&&!$('#v').hidden)renderVentures();
  if(!$('#r').hidden)renderTabs();
},1000);

// FX ENGINE — full-screen canvas: physics particles, hero sprites,
// shockwaves, light rays, colour tints, screen shake and flashes.
// AUDIO — WebAudio synth with a generated reverb tail and a procedural roar.
// =====================================================================
const cv=$('#fxc'),cx=cv.getContext('2d');
let DPR=1,VW=innerWidth,VH=innerHeight;
function resizeFX(){
  DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;
  cv.width=VW*DPR;cv.height=VH*DPR;
}
addEventListener('resize',resizeFX);resizeFX();

const FX={parts:[],ents:[],shake:0,flash:0,running:false,last:0,maxParts:900};
const EMO_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif';
const cxX=()=>VW/2, cyY=()=>VH*.42;

function fxKick(){ if(!FX.running){FX.running=true;FX.last=performance.now();requestAnimationFrame(fxFrame)} }

// --- emitters ---
function emit(o){
  if(FX.parts.length>FX.maxParts)return;
  FX.parts.push({x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,g:o.g??0,drag:o.drag??.985,
    life:o.life||1.6,age:0,sz:o.sz||28,ch:o.ch||null,col:o.col||null,rot:o.rot||0,vr:o.vr||0,
    kind:o.kind||'emoji',glow:o.glow||0,alpha:1});
}
function burst(x,y,o={}){
  const n=Math.round((o.n||24)*(FX.perf||1)),sp=o.speed||420;
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2),s=sp*rnd(.35,1);
    emit({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:o.g??260,drag:o.drag??.978,life:rnd(o.life?0.7*o.life:1.1,o.life||1.9),
      sz:rnd(o.sz?0.6*o.sz:16,o.sz||34),ch:o.chs?pick(o.chs):o.ch,col:o.col,kind:o.col&&!o.chs&&!o.ch?'spark':'emoji',vr:rnd(-6,6),glow:o.glow||0});
  }
}
function sparkRing(x,y,n,r,col,dur=1){
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    emit({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,vx:Math.cos(a)*90,vy:Math.sin(a)*90,g:-30,drag:.97,life:dur*rnd(.8,1.2),sz:rnd(3,6),col,kind:'spark',glow:12});
  }
}
function rain(chs,n,dur=3,o={}){
  n=Math.round(n*(FX.perf||1));
  for(let i=0;i<n;i++){
    const t=rnd(0,dur*.7);
    setTimeout(()=>emit({x:rnd(0,VW),y:-40,vx:rnd(-30,30),vy:rnd(120,260)*(o.speed||1),g:o.g??60,drag:.995,life:dur,sz:rnd(o.min||18,o.max||44),ch:o.col?null:pick(chs),col:o.col?pick(o.col):null,kind:o.col?'confetti':'emoji',rot:rnd(0,6),vr:rnd(-5,5)}),t*1000);
  }
}
function rise(chs,n,dur=3,o={}){
  n=Math.round(n*(FX.perf||1));
  for(let i=0;i<n;i++){
    const t=rnd(0,dur*.6);
    setTimeout(()=>emit({x:rnd(0,VW),y:VH+40,vx:rnd(-40,40),vy:-rnd(160,320)*(o.speed||1),g:-20,drag:.997,life:dur,sz:rnd(o.min||18,o.max||40),ch:pick(chs),rot:0,vr:rnd(-3,3)}),t*1000);
  }
}
function confetti(n,dur=3.2){
  const cols=['#fde047','#f472b6','#60a5fa','#34d399','#fb923c','#a78bfa'];
  rain([],n,dur,{col:cols,min:8,max:14,speed:1.2});
}
// --- scene elements ---
function hero(e,o={}){
  FX.ents.push({type:'hero',e,x:o.x??cxX(),y:o.y??cyY(),size:o.size||160,t0:performance.now()+(o.delay||0),dur:o.dur||2400,anim:o.anim||'pop',spin:o.spin||0,glow:o.glow||null});
  fxKick();
}
function ring(o={}){
  FX.ents.push({type:'ring',x:o.x??cxX(),y:o.y??cyY(),r0:o.r0||20,r1:o.r1||Math.max(VW,VH)*.85,col:o.col||'#fde047',w:o.w||6,t0:performance.now()+(o.delay||0),dur:o.dur||1100});
  fxKick();
}
function tint(col,dur=3000,peak=1,delay=0){
  FX.ents.push({type:'tint',col,t0:performance.now()+delay,dur,peak});fxKick();
}
function rays(col,dur=3000,n=18,delay=0){
  FX.ents.push({type:'rays',col,n,t0:performance.now()+delay,dur});fxKick();
}
function text(txt,o={}){
  FX.ents.push({type:'text',txt,x:o.x??cxX(),y:o.y??VH*.72,size:o.size||44,col:o.col||'#fff',t0:performance.now()+(o.delay||0),dur:o.dur||2400,glow:o.glow||'#000'});
  fxKick();

function shakeFX(v=10){FX.shake=Math.max(FX.shake,v)}
function flashFX(a=.7){FX.flash=Math.max(FX.flash,a)}
function bodyShake(){document.querySelector('main').animate([{transform:'translate(0,0)'},{transform:'translate(-6px,3px)'},{transform:'translate(5px,-4px)'},{transform:'translate(-3px,2px)'},{transform:'translate(0,0)'}],{duration:420})}

// --- frame loop ---
const ease={
  out:t=>1-Math.pow(1-t,3),
  back:t=>1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2),
  inOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2
};
function fxFrame(now){
  const dt=Math.min(.05,(now-FX.last)/1000);FX.last=now;
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.clearRect(0,0,VW,VH);
  cx.save();
  if(FX.shake>.3)cx.translate(rnd(-FX.shake,FX.shake),rnd(-FX.shake,FX.shake));
  cx.textAlign='center';cx.textBaseline='middle';

  // ents
  FX.ents=FX.ents.filter(en=>now<en.t0+en.dur+50);
  for(const en of FX.ents){
    const p=clamp((now-en.t0)/en.dur,0,1);
    if(now<en.t0)continue;
    if(en.type=='tint'){
      const a=p<.2?p/.2*en.peak:p>.7?(1-(p-.7)/.3)*en.peak:en.peak;
      cx.fillStyle=en.col.replace('A',(a).toFixed(3));
      cx.globalAlpha=1;cx.fillRect(-20,-20,VW+40,VH+40);
    }else if(en.type=='rays'){
      cx.save();cx.translate(cxX(),cyY());cx.rotate(p*Math.PI*1.2);
      const r=Math.max(VW,VH)*1.2;cx.globalAlpha=(p<.15?p/.15:p>.8?(1-p)/.2:1)*.55;
      for(let i=0;i<en.n;i++){
        cx.rotate(Math.PI*2/en.n);cx.beginPath();cx.moveTo(0,0);cx.lineTo(r,-r*.05);cx.lineTo(r,r*.05);cx.closePath();
        cx.fillStyle=en.col;cx.fill();
      }
      cx.restore();cx.globalAlpha=1;
    }else if(en.type=='ring'){
      const e2=ease.out(p),r=en.r0+(en.r1-en.r0)*e2;
      cx.globalAlpha=1-p;cx.lineWidth=en.w*(1-p*.6);cx.strokeStyle=en.col;
      cx.shadowColor=en.col;cx.shadowBlur=24;
      cx.beginPath();cx.arc(en.x,en.y,r,0,Math.PI*2);cx.stroke();
      cx.shadowBlur=0;cx.globalAlpha=1;
    }else if(en.type=='hero'){
      let s=1,a=1,dy=0,r=en.spin*p;
      if(en.anim=='pop'){const q=ease.back(clamp(p/.22,0,1));s=.1+.9*q;a=p>.8?1-(p-.8)/.2:1}
      else if(en.anim=='drop'){const q=p<.35?ease.out(p/.35):1;dy=-(1-q)*VH*.5;s=1+(p<.35?0:Math.sin((p-.35)*14)*.04*(1-p));a=p>.85?1-(p-.85)/.15:1}
      else if(en.anim=='roar'){s=.2+1.1*ease.back(clamp(p/.3,0,1));if(p>.3)s+=Math.sin((p-.3)*26)*.05*(1-p);a=p>.9?1-(p-.9)/.1:1}
      else if(en.anim=='rise'){const q=ease.out(clamp(p/.4,0,1));dy=(1-q)*VH*.45;s=.6+.4*q;a=p>.85?1-(p-.85)/.15:1}
      else if(en.anim=='fly'){const q=ease.inOut(p);dy=-q*VH*.1;s=1;a=p>.9?1-(p-.9)/.1:1;r=Math.sin(p*Math.PI*2)*.15}
      else if(en.anim=='fade'){a=p<.2?p/.2:p>.8?1-(p-.8)/.2:1;s=1+p*.15}
      cx.save();cx.globalAlpha=clamp(a,0,1);cx.translate(en.x,en.y+dy);cx.rotate(r);
      cx.font=`${en.size*s}px ${EMO_FONT}`;
      cx.shadowColor=en.glow||'rgba(255,220,120,.8)';cx.shadowBlur=en.glow===false?0:50*s;
      cx.fillText(en.e,0,0);cx.restore();
    }else if(en.type=='text'){
      const q=ease.back(clamp(p/.16,0,1)),a=p>.85?1-(p-.85)/.15:1;
      cx.save();cx.globalAlpha=clamp(a,0,1);cx.translate(en.x,en.y);cx.scale(.4+.6*q,.4+.6*q);
      cx.font=`900 ${en.size}px ui-rounded,system-ui,sans-serif`;cx.fillStyle=en.col;
      cx.shadowColor=en.glow;cx.shadowBlur=20;cx.fillText(en.txt,0,0);
      cx.restore();
    }
  }

  // particles
  FX.parts=FX.parts.filter(pt=>(pt.age+=dt)<pt.life&&pt.y<VH+200);
  for(const pt of FX.parts){
    pt.vy+=pt.g*dt;pt.vx*=Math.pow(pt.drag,dt*60);pt.vy*=Math.pow(pt.drag,dt*60);
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.rot+=pt.vr*dt;
    const life=pt.age/pt.life,a=life>.7?1-(life-.7)/.3:1;
    cx.globalAlpha=clamp(a,0,1);
    if(pt.kind=='spark'){
      cx.fillStyle=pt.col;cx.shadowColor=pt.col;cx.shadowBlur=pt.glow||10;
      cx.beginPath();cx.arc(pt.x,pt.y,pt.sz*(1-life*.5),0,Math.PI*2);cx.fill();cx.shadowBlur=0;
    }else if(pt.kind=='confetti'){
      cx.save();cx.translate(pt.x,pt.y);cx.rotate(pt.rot);cx.fillStyle=pt.col;
      cx.fillRect(-pt.sz/2,-pt.sz/4,pt.sz,pt.sz/2);cx.restore();
    }else{
      cx.save();cx.translate(pt.x,pt.y);cx.rotate(pt.rot);
      cx.font=`${pt.sz}px ${EMO_FONT}`;
      if(pt.col){cx.fillStyle=pt.col;cx.beginPath();cx.arc(0,0,pt.sz/2,0,Math.PI*2);cx.fill()}
      else cx.fillText(pt.ch,0,0);
      cx.restore();
    }
  }
  cx.globalAlpha=1;
  cx.restore();

  FX.shake*=.86;FX.flash*=.82;
  if(FX.flash>.01){cx.fillStyle=`rgba(255,255,255,${FX.flash})`;cx.fillRect(0,0,VW,VH)}

  if(FX.parts.length||FX.ents.length||FX.flash>.01||FX.shake>.3)requestAnimationFrame(fxFrame);
  else FX.running=false;
}

let AC=null,MASTER=null,VERB=null;
function audio(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      MASTER=AC.createGain();MASTER.gain.value=.85;MASTER.connect(AC.destination);
      VERB=AC.createConvolver();
      const len=AC.sampleRate*2.6,buf=AC.createBuffer(2,len,AC.sampleRate);
      for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
      VERB.buffer=buf;const vg=AC.createGain();vg.gain.value=.4;VERB.connect(vg);vg.connect(MASTER);
    }catch(e){AC=null}
  }
  if(AC&&AC.state=='suspended')AC.resume();
  return AC;
}
function sfxTone(f,d,ty='sine',v=.15,at=0,f2,wet=0){
  const a=audio();if(!a)return;
  try{
    const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();
    o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.04,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(MASTER);if(wet)g.connect(VERB);
    o.start(t);o.stop(t+d+.05);
  }catch(e){}
}
function sfxNoise(d,v=.1,at=0,hz=1000,hz2,wet=0){
  const a=audio();if(!a)return;
  try{
    const t=a.currentTime+at,n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
    for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    s.buffer=b;f.frequency.setValueAtTime(hz,t);if(hz2)f.frequency.exponentialRampToValueAtTime(hz2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(MASTER);if(wet)g.connect(VERB);s.start(t);
  }catch(e){}
}
function sfxDing(f,t=.15,ty='sine'){sfxTone(f,t*3,ty,.1)}
function sfxTick(f){sfxTone(f,.05,'square',.04)}
// Procedural lion roar: detuned sawtooths, vibrato, formant-ish bandpass, reverb tail.
function sfxRoar(at=0,len=1.8,vol=.35){
  const a=audio();if(!a)return;
  try{
    const t=a.currentTime+at;
    const out=a.createGain();out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(vol,t+.15);
    out.gain.linearRampToValueAtTime(vol*.8,t+len*.6);out.gain.exponentialRampToValueAtTime(.001,t+len);
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(700,t);lp.frequency.linearRampToValueAtTime(1400,t+len*.5);lp.frequency.linearRampToValueAtTime(500,t+len);
    const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=6;lg.gain.value=9;lfo.connect(lg);
    for(const det of [0,7,-9]){
      const o=a.createOscillator();o.type='sawtooth';
      o.frequency.setValueAtTime(140+det,t);o.frequency.linearRampToValueAtTime(92+det,t+len*.5);o.frequency.linearRampToValueAtTime(70+det,t+len);
      lg.connect(o.frequency);o.connect(lp);o.start(t);o.stop(t+len+.1);
    }
    const nz=a.createBufferSource(),nb=a.createBuffer(1,a.sampleRate*len|0,a.sampleRate),nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*.5;
    nz.buffer=nb;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=1.2;
    const ng=a.createGain();ng.gain.value=.35;nz.connect(bp);bp.connect(ng);
    lp.connect(out);ng.connect(out);out.connect(MASTER);out.connect(VERB);
    lfo.start(t);lfo.stop(t+len+.1);nz.start(t);nz.stop(t+len);
  }catch(e){}
}
function sfxBoom(at=0,vol=.5){sfxTone(70,1.4,'sine',vol,at,28,.6);sfxNoise(1.1,vol*.5,at,600,60,.5)}
function sfxSparkle(at=0){[1568,2093,2637,3136].forEach((f,i)=>sfxTone(f,.25,'triangle',.05,at+i*.05,null,.8))}
function sfxFanfare(at=0){[523.25,659.25,783.99,1046.5].forEach((f,i)=>sfxTone(f,.7,'triangle',.09,at+i*.11,null,.6))}

function hexToRgba(hex,a){
  const h=hex.replace('#','');const n=parseInt(h.length==3?h.split('').map(x=>x+x).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function receipt(e,n,s,tot,credit=false){
  S.rec.unshift({e,n,s,q:1,tot:credit?-Math.abs(tot):Math.abs(tot),t:Date.now(),d:1});
  S.rec=S.rec.slice(0,150);
}
function spend(amount,label){
  if(amount>S.bal+1e-9){toast(`Not enough cash for ${label} (need ${fmt(amount)})`);sfxTone(150,.25,'sawtooth');return false}
  S.bal=+(S.bal-amount).toFixed(2);S.spent+=amount;setBal(-1);flt('−'+fmt(amount));return true;
}
function earn(amount,e,label,s){
  S.bal=+(S.bal+amount).toFixed(2);setBal(1);flt('+'+fmt(amount),1);receipt(e,label,s,amount,true);
}
function sparkSVG(hist,col){
  if(hist.length<2)return '';
  const mn=Math.min(...hist),mx=Math.max(...hist),rg=mx-mn||1;
  const pts=hist.map((v,i)=>`${(i/(hist.length-1)*120).toFixed(1)},${(38-(v-mn)/rg*34).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 120 40" preserveAspectRatio="none"><defs><linearGradient id="g${col.slice(1)}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><polygon points="0,40 ${pts.join(' ')} 120,40" fill="url(#g${col.slice(1)})"/><polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}
function delta(x){const d=(x.p-x.prev)/x.prev*100;return d}

// ---------- Action handlers (event delegation) ----------
const ACTS={
  buyStock(t,q){
    const x=tickerOf(t);const n=q==='all'?0:+q;
    const cost=x.p*n;
    if(!spend(cost,x.name))return;
    const h=S.stk[t]||{q:0,cost:0};
    h.cost=(h.cost*h.q+x.p*n)/(h.q+n);h.q+=n;S.stk[t]=h;
    receipt('📈',`Bought ${n} × ${t}`,x.name,cost);
    burst(VW*.5,VH*.4,{col:x.c,n:10,speed:200});
    sfxTick(880);
  },
  sellStock(t,q){
    const x=tickerOf(t),h=S.stk[t];if(!h)return;
    const n=q==='all'?h.q:Math.min(+q,h.q),gain=x.p*n;
    h.q-=n;if(h.q<=0)delete S.stk[t];
    const pnl=(x.p-(h.cost||x.p))*n;
    earn(gain,pnl>=0?'💰':'📉',`Sold ${n} × ${t} (${pnl>=0?'+':'−'}${fmt(Math.abs(pnl))})`,x.name);
    sfxDing(pnl>=0?990:330,.1);
    renderVentures();
  },
  buyProp(id){
    const p=propOf(id);
    if(!spend(p.price,p.n))return;
    S.prop.push({pid:p.id,n:p.n,e:p.e,cost:p.price,value:p.price,rent:p.rent,tax:p.tax});
    receipt('🔑','Bought: '+p.n,'Real estate',p.price);
    celebrateRaw(p.e,'Keys in hand!','#7dd3fc');
  },
  sellProp(idx){
    const p=S.prop[idx];if(!p)return;const v=p.value*.96;
    S.prop.splice(idx,1);earn(v,'🏷️','Sold: '+p.n,'Real estate');
    renderVentures();
  },
  investStartup(sid,amt){
    amt=+amt;const s=stupOf(sid);
    if(!spend(amt,s.n))return;
    let b=S.biz.find(x=>x.kind=='startup'&&x.sid==sid&&!x.dead);
    if(!b){b={kind:'startup',sid,name:s.n,e:s.e,invested:0,val:0,win:s.win,mult:s.mult,dead:false,notes:'Round closed'};S.biz.push(b)}
    b.invested+=amt;b.val+=amt;
    receipt('🚀','Invested: '+s.n,s.stage,amt);
    burst(VW*.5,VH*.45,{chs:['🚀','✨','💫'],n:18,speed:300});
    renderVentures();
  },
  exitStartup(idx){
    const b=S.biz[idx];if(!b||b.kind!='startup')return;
    const v=b.val*.9;S.biz.splice(idx,1);
    earn(v,'🎉','Exit: '+b.name,'Startup');
    celebrateRaw('🎉','Exit closed!','#fde047');
    renderVentures();
  },
  buyBiz(id){
    const b=bizOf(id);
    if(!spend(b.cost,b.n))return;
    S.biz.push({kind:'biz',bid:b.id,name:b.n,e:b.e,income:b.income,upkeep:b.upkeep,staffPay:b.staffPay,staff:0,val:b.cost});
    receipt('🏢','Opened: '+b.n,'Business',b.cost);
    celebrateRaw(b.e,'Business open!','#fbbf24');
    renderVentures();
  },
  hireStaff(idx){
    const b=S.biz[idx];if(!b||b.kind!='biz')return;
    if(!spend(5000,'recruiting'))return;
    b.staff=(b.staff||0)+1;receipt('🧑‍💼','Hired staff: '+b.name,'Payroll',5000);
    renderVentures();
  },
  fireStaff(idx){
    const b=S.biz[idx];if(!b||!b.staff)return;b.staff--;renderVentures();
  },
  sellBiz(idx){
    const b=S.biz[idx];if(!b||b.kind!='biz')return;const v=b.val*.6;
    S.biz.splice(idx,1);earn(v,'🏷️','Sold: '+b.name,'Business');renderVentures();
  },
  donate(amt){
    amt=+amt;if(!spend(amt,'donation'))return;
    S.k+=Math.log10(amt+1)*3;S.karma+=Math.log10(amt+1)*3;S.c+=Math.log10(amt+1);
    receipt('💚','Donation','Philanthropy',amt);
    confetti(60,2.6);sfxFanfare(0);
    toast('💚 Thank you for your generosity!');
    renderVentures();
  }
};

    return`<div class="rec"><span style="font-size:24px">${r.e}</span>
      <div><b>${r.q>1?r.q.toLocaleString()+'× ':''}${r.n}</b><small>${r.s} · ${new Date(r.t).toLocaleTimeString('en-CA')} · ${st}</small></div>
      <b style="color:${isCredit?'var(--ok)':'var(--bad)'}">${isCredit?'+'+fmt(Math.abs(r.tot)):'−'+fmt(r.tot)}</b></div>`;
  }).join(''):'<div class="empty">No receipts yet.</div>';
}
</script>
</body>
</html>
