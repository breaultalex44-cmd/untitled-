function renderTabs(){const inv=Object.keys(S.inv),subs=Object.keys(S.subs);
 $('#m').innerHTML=`<div class="rec"><div><b style="color:var(--ink)">📊 Impact</b><small>😊 happiness ${Math.round(S.h)} · 📣 clout ${Math.round(S.c)} · 💖 karma ${Math.round(S.k)} · ad impressions ${S.imp.toLocaleString()} · total spent ${fmt(S.spent)}</small></div></div>`+(subs.length?'<h3>Subscriptions (billed every 20 seconds)</h3>':'')+subs.map(k=>{const[c,it]=ITM(k);return`<div class="rec"><span>${it.e}</span><div>${it.n}<small>${c.n} · ${fmt(it.p)}/mo</small></div><button class="buy" data-k="${k}">Cancel</button></div>`}).join('')+'<h3>Everything you own</h3>'+(inv.length?inv.map(k=>{const[c,it]=ITM(k);return`<div class="rec"><span style="font-size:24px">${it.e}</span><div>${it.n}<small>${c.n}</small></div><b style="color:var(--ink)">×${S.inv[k].toLocaleString()}</b></div>`}).join(''):'<div class="empty">Nothing yet. Open a store and spend something.</div>');
 $('#m').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{delete S.subs[b.dataset.k];save();stats();renderTabs();toast('Subscription cancelled')});

document.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs [data-t]').forEach(x=>x.className=x==b?'on':'');['s','m','r'].forEach(i=>$('#'+i).hidden=i!=b.dataset.t);renderTabs()});
