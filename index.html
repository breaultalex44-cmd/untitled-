<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpendSim Ultimate — Masterpiece Edition</title>
<style>
:root{
  --bg:#eef1f6;--card:#ffffff;--ink:#101523;--mut:#667089;--line:#dde2ee;
  --acc:#5b3df5;--ok:#0fa968;--bad:#e5383b;--warn:#f59e0b;--hd:#ffffffee;
  box-sizing:border-box;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#080b14;--card:#121829;--ink:#eef1fb;--mut:#8a93b0;--line:#222a44;--acc:#8d78ff;--ok:#2be08f;--bad:#ff5c5f;--warn:#fbbf24;--hd:#0c1020ee;color-scheme:dark}
}
:root[data-theme=dark]{--bg:#080b14;--card:#121829;--ink:#eef1fb;--mut:#8a93b0;--line:#222a44;--acc:#8d78ff;--ok:#2be08f;--bad:#ff5c5f;--warn:#fbbf24;--hd:#0c1020ee;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;overflow-x:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input[type=search],input[type=text],input[type=number],select{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}

/* HUD */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);backdrop-filter:blur(14px);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.bal small{color:var(--mut);display:flex;align-items:center;gap:6px;font-weight:600}
#bal{font-size:clamp(24px,6vw,42px);font-weight:800;font-variant-numeric:tabular-nums;color:var(--ok);letter-spacing:-.02em;transition:color .2s}
#bal.hit{color:var(--bad);animation:jolt .4s}
#bal.gain{color:var(--ok);animation:pulseOk .5s}
.meter{height:6px;border-radius:9px;background:var(--line);margin-top:4px;overflow:hidden;min-width:210px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),#ffb020,var(--ok));transition:width .9s cubic-bezier(.2,.8,.2,1)}
#st{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
#st span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:700;white-space:nowrap}
.fl{position:fixed;left:16px;top:88px;font-weight:800;font-size:20px;color:var(--bad);animation:up 1.6s forwards;pointer-events:none;z-index:12}
.fl.g{color:var(--ok)}

/* Layout */
main{max-width:1180px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 74px max(16px,env(safe-area-inset-left,0px));min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tabs button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700;transition:transform .12s}
.tabs button:active{transform:scale(.96)}
.tabs .on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs #rs{margin-left:auto;color:var(--mut)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.chips .on{background:var(--ink);color:var(--bg)}
.sec-h{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}

/* Store grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.co{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative}
.co:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 8px 20px #00000012}
.lg{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;margin-bottom:8px}
.co b{display:block;font-size:15px}
.co small{color:var(--mut);font-size:12px}

/* Layers and sheets */
.layer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));background:#04060dd9;backdrop-filter:blur(7px)}
.layer.on{display:flex}
#ov{z-index:20}#ck{z-index:30}#lay{z-index:40}
#fxc{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px;width:100%;max-width:490px;max-height:100%;overflow:auto;animation:pop .28s cubic-bezier(.2,1.35,.4,1)}
.sh{padding:18px;color:#fff;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2}
.sh i{font-style:normal;font-size:34px}
.sh button{margin-left:auto;font-size:22px;color:#fff;width:34px;height:34px;border-radius:50%;background:#0003;display:grid;place-items:center}
.row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.row>span:first-child{font-size:26px;flex-shrink:0}
.row div{flex:1;min-width:0}
.row small{color:var(--mut);display:block;font-size:12.5px}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;margin-top:3px;margin-right:4px}
.badge.inc{background:#0fa96822;color:var(--ok)}
.badge.upk{background:#e5383b22;color:var(--bad)}
.badge.per{background:#5b3df522;color:var(--acc)}
.badge.rar-uncommon{background:#10b98122;color:#10b981}
.badge.rar-rare{background:#3b82f622;color:#3b82f6}
.badge.rar-epic{background:#a855f722;color:#a855f7}
.badge.rar-legendary{background:#f59e0b22;color:#f59e0b}
.badge.rar-mythic{background:#ef444422;color:#ef4444}
.buy{background:var(--acc);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;white-space:nowrap;transition:transform .1s}
.buy:active{transform:scale(.95)}
.buy:disabled{opacity:.45}
.ghost{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;background:var(--card);white-space:nowrap}
.ghost:disabled{opacity:.4}
.good{color:var(--ok)}.bad{color:var(--bad)}

/* Checkout + 15 Logic-Driven Card Animations */
.ckb{padding:18px}
.ckb h3{margin:0 0 2px}
.qty{display:flex;gap:6px;margin:10px 0;align-items:center;flex-wrap:wrap}
.qty button{border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-weight:600}
.qty b{min-width:56px;text-align:center}
.pay-mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.pay-mode button{padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:12.5px;text-align:center}
.pay-mode button.on{border-color:var(--acc);background:#5b3df51c;color:var(--acc)}
.pay-mode button.loc.on{border-color:var(--warn);background:#f59e0b22;color:var(--warn)}
.card-stage{perspective:1000px;margin:10px 0 14px;position:relative;height:168px}
.card{height:168px;border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#1b2a6b,#6a2fd8 60%,#d6357f);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;font-family:ui-monospace,monospace;letter-spacing:.08em;box-shadow:0 12px 28px #00000033;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.9,.3,1.1),box-shadow .4s}
.card-top{display:flex;justify-content:space-between;align-items:center;z-index:2}
.chip{width:40px;height:28px;border-radius:6px;background:linear-gradient(135deg,#f6d98a,#b98d2e);position:relative;overflow:hidden}
.chip::after{content:"";position:absolute;inset:6px;border:1px solid #0003;border-radius:3px}
.card-mid{z-index:2;font-size:16.5px;font-weight:700;text-shadow:0 2px 6px #0004}
.card-bot{display:flex;justify-content:space-between;align-items:flex-end;z-index:2;font-size:11.5px}
.fx-overlay{position:absolute;inset:0;pointer-events:none;z-index:3;display:grid;place-items:center;opacity:0}
.card.busy .fx-overlay{opacity:1}

/* 15 distinct card animation themes */
.card.s0.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,#ffffff88 50%,transparent 75%);animation:sweep .8s infinite}
.card.s1{background:linear-gradient(135deg,#0f172a,#1e3a8a 55%,#0284c7)}
.card-back{position:absolute;inset:0;background:linear-gradient(135deg,#090d16,#1e293b);border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;backface-visibility:hidden;transform:rotateY(180deg);z-index:3}
.magstripe{height:34px;background:#000;margin:4px -18px}
.cvv-bar{background:#fff;color:#111;padding:6px 10px;border-radius:6px;display:flex;justify-content:space-between;font-weight:800;font-size:13px}
.laser-beam{position:absolute;left:0;right:0;height:3px;background:#38bdf8;box-shadow:0 0 14px 4px #38bdf8,0 0 24px #fff;top:20%;opacity:0;z-index:4}
.card.s1.busy{transform:rotateY(180deg)}
.card.s1.busy .laser-beam{opacity:1;animation:laserScan .85s ease-in-out infinite alternate}
.card.s2{background:linear-gradient(135deg,#064e3b,#059669 55%,#10b981)}
.nfc-ring{position:absolute;width:60px;height:60px;border-radius:50%;border:3px solid #6ee7b7;opacity:0}
.card.s2.busy{transform:perspective(700px) rotateX(24deg) scale(.94) translateY(8px);box-shadow:0 22px 40px #10b98166}
.card.s2.busy .nfc-ring:nth-child(1){animation:nfcWave 1.1s ease-out infinite}
.card.s2.busy .nfc-ring:nth-child(2){animation:nfcWave 1.1s ease-out .35s infinite}
.card.s2.busy .nfc-ring:nth-child(3){animation:nfcWave 1.1s ease-out .7s infinite}
.card.s3{background:radial-gradient(circle at 20% 20%,#3f3f46,#18181b 60%,#09090b);border:1px solid #52525b}
.card.s3.busy{animation:metalSlam .7s cubic-bezier(.3,1.6,.4,1) forwards}
.card.s4{background:linear-gradient(125deg,#ff0080,#7928ca,#0070f3,#00dfd8,#ff0080);background-size:300% 300%;animation:holoShift 4s ease infinite}
.card.s4.busy{transform:rotateY(-12deg) rotateX(8deg) scale(1.03)}
.card.s5{background:linear-gradient(135deg,#082f49,#0284c7,#bae6fd)}
.card.s5.busy{animation:cryoPulse .7s ease-in-out infinite alternate;box-shadow:0 0 32px #38bdf8aa}
.card.s6{background:linear-gradient(135deg,#1e1b4b,#4f46e5,#ec4899)}
.card.s6.busy{animation:warpTwist .9s cubic-bezier(.2,1.4,.4,1) infinite alternate}
.card.s7{background:linear-gradient(135deg,#78350f,#d97706,#fde047);color:#1c1917}
.card.s7.busy{animation:goldStamp .6s cubic-bezier(.3,1.7,.4,1) forwards;box-shadow:0 0 36px #facc15aa}
.card.s8{background:linear-gradient(135deg,#022c22,#065f46,#10b981)}
.card.s8.busy{animation:matrixGlitch .35s steps(2) infinite;box-shadow:0 0 28px #34d39999}
.card.s9{background:linear-gradient(135deg,#064e3b,#047857,#fbbf24)}
.card.s9.busy{transform:scale(1.04) rotateZ(-2deg);box-shadow:0 18px 40px #10b98188}
.card.s10{background:linear-gradient(135deg,#4c0519,#9f1239,#f43f5e)}
.card.s10.busy{transform:rotateX(16deg) scale(1.03);box-shadow:0 20px 38px #f43f5e88}
.card.s11{background:linear-gradient(135deg,#09090b,#312e81,#06b6d4)}
.card.s11.busy{animation:cyberPulse .55s ease-in-out infinite alternate;box-shadow:0 0 32px #06b6d4bb}
.card.s12{background:linear-gradient(135deg,#1e293b,#64748b,#f8fafc);color:#0f172a}
.card.s12.busy{animation:diamondTilt .8s ease-in-out infinite alternate;box-shadow:0 0 35px #ffffffcc}
.card.s13{background:linear-gradient(135deg,#7c2d12,#ea580c,#fde047)}
.card.s13.busy{animation:solarFlare .65s ease-in-out infinite alternate;box-shadow:0 0 38px #f97316cc}
.card.s14{background:radial-gradient(circle at 50% 50%,#27272a,#09090b 75%);border:1px solid #f59e0b88}
.card.s14.busy{animation:blackOps .7s cubic-bezier(.2,1.5,.4,1) forwards;box-shadow:0 0 40px #f59e0b88}

.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800}
.stat{min-height:22px;color:var(--mut);margin:8px 0;font-weight:600}
.pay{width:100%;padding:14px;border-radius:14px;background:var(--ok);color:#04150d;font-weight:800;font-size:17px;transition:transform .1s}
.pay.loc-btn{background:var(--warn);color:#1c1202}
.pay:active{transform:scale(.98)}
.pay:disabled{opacity:.6}
.res{padding:30px 20px;text-align:center}
.res h2{margin:14px 0 4px}
.res p{color:var(--mut);margin:3px 0}
.res.no{animation:shake .5s}
.res svg{width:92px;height:92px}
.res circle{fill:none;stroke-width:5;stroke-dasharray:190;stroke-dashoffset:190;animation:draw .6s forwards}
.res path{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .5s forwards}
.res.ok svg{stroke:var(--ok)}
.res.no svg{stroke:var(--bad)}

/* Interactive Multi-Platform Live Studio */
.tt-live{width:100%;max-width:440px;height:min(88vh,760px);border-radius:26px;overflow:hidden;background:#09090f;color:#fff;position:relative;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 24px 60px #000a;border:1px solid #ffffff22;animation:pop .32s cubic-bezier(.2,1.3,.4,1)}
.tt-live.yt-mode{max-width:540px;background:#0f0f0f;border-color:#ff000044}
.tt-live.tw-mode{max-width:480px;background:#0e0e10;border-color:#9146ff55}
.tt-live.kk-mode{max-width:480px;background:#071209;border-color:#53fc1855}
.tt-stage{position:absolute;inset:0;background:radial-gradient(circle at 50% 32%,#ff2c5555,#4f46e544 45%,#09090f 85%);background-size:200% 200%;animation:bg 5s ease infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.yt-mode .tt-stage{background:radial-gradient(circle at 50% 28%,#ff000044,#28282866 48%,#0f0f0f 86%)}
.tw-mode .tt-stage{background:radial-gradient(circle at 50% 30%,#9146ff55,#1f1f2366 48%,#0e0e10 86%)}
.kk-mode .tt-stage{background:radial-gradient(circle at 50% 30%,#53fc1838,#14532d66 48%,#071209 86%)}
.tt-avatar-ring{width:124px;height:124px;border-radius:50%;padding:5px;background:linear-gradient(45deg,#ff2c55,#00f2fe,#ff2c55);animation:spinSlow 4s linear infinite;display:grid;place-items:center;box-shadow:0 0 40px #ff2c5566}
.yt-mode .tt-avatar-ring{background:linear-gradient(45deg,#ff0000,#ff8a00,#ff0000)}
.tw-mode .tt-avatar-ring{background:linear-gradient(45deg,#9146ff,#00f5d4,#9146ff)}
.kk-mode .tt-avatar-ring{background:linear-gradient(45deg,#53fc18,#22c55e,#53fc18)}
.tt-avatar{width:100%;height:100%;border-radius:50%;background:#13131f;display:grid;place-items:center;font-size:62px;animation:spinSlowReverse 4s linear infinite}
.tt-eq{display:flex;gap:4px;height:20px;align-items:flex-end;margin-top:10px}
.tt-eq i{width:4px;background:#00f2fe;border-radius:4px;animation:eqBar .45s ease-in-out infinite alternate}
.tt-eq i:nth-child(2){animation-delay:.12s;background:#ff2c55}
.tt-eq i:nth-child(3){animation-delay:.24s}
.tt-eq i:nth-child(4){animation-delay:.08s;background:#ff2c55}
.tt-eq i:nth-child(5){animation-delay:.3s}
.tt-top{position:relative;z-index:3;padding:11px;display:flex;flex-direction:column;gap:7px;background:linear-gradient(#000c,transparent)}
.tt-plat-tabs{display:flex;gap:4px;align-items:center}
.tt-plat-tabs button{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:#ffffff18;color:#cbd5e1}
.tt-plat-tabs button.on{background:#fff;color:#09090f}
.tt-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tt-creator{display:flex;align-items:center;gap:8px;background:#0007;backdrop-filter:blur(8px);padding:4px 10px 4px 5px;border-radius:99px;border:1px solid #ffffff1a}
.tt-creator .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff2c55,#7928ca);display:grid;place-items:center;font-size:18px}
.yt-mode .tt-creator .av{background:linear-gradient(135deg,#ff0000,#991b1b)}
.tw-mode .tt-creator .av{background:linear-gradient(135deg,#9146ff,#4c1d95)}
.kk-mode .tt-creator .av{background:linear-gradient(135deg,#53fc18,#15803d)}
.tt-creator div{line-height:1.15}
.tt-creator b{font-size:12.5px;display:block}
.tt-creator small{font-size:10.5px;color:#cbd5e1}
.tt-follow{background:#fe2c55;color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px}
.yt-mode .tt-follow{background:#ff0000}
.tw-mode .tt-follow{background:#9146ff}
.kk-mode .tt-follow{background:#53fc18;color:#052e16}
.tt-stats{display:flex;align-items:center;gap:6px}
.tt-pill{background:#0007;backdrop-filter:blur(8px);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.tt-live-tag{background:#fe2c55;padding:3px 7px;border-radius:6px;font-size:10.5px;font-weight:900;letter-spacing:.04em}
.yt-mode .tt-live-tag{background:#ff0000}
.tw-mode .tt-live-tag{background:#9146ff}
.kk-mode .tt-live-tag{background:#53fc18;color:#052e16}
.tt-close{width:30px;height:30px;border-radius:50%;background:#0007;color:#fff;display:grid;place-items:center;font-size:16px}
.tt-pk{background:#0008;border-radius:99px;padding:3px;border:1px solid #ffffff22}
.tt-pk-labels{display:flex;justify-content:space-between;font-size:11px;font-weight:800;padding:0 8px 3px}
.tt-pk-track{height:9px;border-radius:99px;background:#2563eb;overflow:hidden;display:flex}
.tt-pk-fill{height:100%;background:linear-gradient(90deg,#fe2c55,#f59e0b);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.yt-mode .tt-pk-track{background:#27272a}
.yt-mode .tt-pk-fill{background:linear-gradient(90deg,#ff0000,#f59e0b,#fde047)}
.tw-mode .tt-pk-track{background:#26262c}
.tw-mode .tt-pk-fill{background:linear-gradient(90deg,#9146ff,#ec4899,#00f5d4)}
.kk-mode .tt-pk-track{background:#14532d}
.kk-mode .tt-pk-fill{background:linear-gradient(90deg,#53fc18,#fde047)}
.tt-vip{align-self:flex-start;background:linear-gradient(90deg,#f59e0b,#eab308);color:#111;font-size:11px;font-weight:900;padding:3px 10px;border-radius:99px;box-shadow:0 4px 12px #f59e0b55}
.yt-ticker{display:flex;gap:6px;overflow:hidden;padding:2px 0}
.yt-chip{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 3px 10px #0006;animation:pop .3s}
.tt-gift-combo{position:relative;z-index:4;margin:2px 11px;background:linear-gradient(90deg,#fe2c55dd,#7c3aedcc,transparent);border-radius:99px;padding:5px 13px;display:flex;align-items:center;gap:10px;animation:slideInLeft .4s cubic-bezier(.2,1.4,.4,1)}
.yt-mode .tt-gift-combo{background:linear-gradient(90deg,#ff0000dd,#b91c1ccc,transparent)}
.tw-mode .tt-gift-combo{background:linear-gradient(90deg,#9146ffdd,#4f46e5cc,transparent)}
.kk-mode .tt-gift-combo{background:linear-gradient(90deg,#53fc18cc,#15803dcc,transparent);color:#04150d}
.tt-gift-combo .gi{font-size:32px;animation:bob .5s infinite alternate}
.tt-gift-combo .gx{font-size:22px;font-weight:900;font-style:italic;color:#fde047;text-shadow:0 2px 10px #000}
.tt-bot{position:relative;z-index:3;padding:9px 11px 13px;background:linear-gradient(transparent,#000d 40%,#000)}
.tt-sc-pin{margin-bottom:7px;border-radius:14px;overflow:hidden;background:var(--c,#e62117);animation:drop .5s cubic-bezier(.2,1.4,.4,1);box-shadow:0 8px 24px #0008}
.tt-sc-pin .hd{padding:6px 12px;font-weight:800;font-size:12.5px;display:flex;justify-content:space-between}
.tt-sc-pin .bd{padding:6px 12px;background:#0004;font-size:13px;font-weight:600}
.tt-sc-pin u{display:block;height:3px;background:#fff;animation:bar 9s linear forwards;transform-origin:left}

function getDynamicCreditLimit(){
  const base=Math.max(250000, S.start*0.25);

  return Math.round((base+nwBoost)*scoreMult);
}

  S.creditLimit=getDynamicCreditLimit();
  return Math.max(0, S.creditLimit - S.creditUsed);
}

// ---------- Net worth & cashflow ----------
function portfolioValue(){
  let v=0;
  for(const t in S.stk){const x=tickerOf(t);if(x)v+=x.p*S.stk[t].q}
  return v;
}
function propValue(){return S.prop.reduce((a,p)=>a+p.value,0)}
function bizValue(){return S.biz.reduce((a,b)=>a+(b.dead?0:b.kind=='startup'?b.val:b.val||0),0)}
function getNetWorthRaw(){
  let assets=0;
  for(const k in S.inv){
    const[,it]=ITM(k);
    if(it&&!/[mshag]/.test(it.f))assets+=it.p*S.inv[k]*.7;
  }
  return S.bal+assets+portfolioValue()+propValue()+bizValue();
}
function getNetWorth(){
  return Math.max(0, getNetWorthRaw() - S.creditUsed);
}
function getCycleNet(){
  let net=0;
  for(const k in S.subs){const[,it]=ITM(k);if(it)net-=it.p}
  for(const k in S.inv){const[,it]=ITM(k);if(it&&it.cf)net+=it.cf*S.inv[k]}
  S.prop.forEach(p=>{net+=p.rent-p.tax});
  S.biz.forEach(b=>{if(!b.dead&&b.kind!='startup')net+=b.income*(1+(b.staff||0)*.15+(b.rd||0)*.25)-b.upkeep-(b.staff||0)*b.staffPay});
  if(S.creditUsed>0) net -= S.creditUsed * S.apr;
  return net;
}

// Picks a card animation out of all 15 based on item price, category, payment method, and randomness
function pickSmartCardAnim(c,it,tot,useCredit){
  let pool=[];
  if(useCredit) pool=[3,9,14,1,7,11]; // Credit line favors Obsidian, Syndicate, Black-Ops, Laser, Gold, Cyber
  else if(tot>=1000000) pool=[14,7,12,6,3,13]; // Million+ purchases
  else if(tot>=50000) pool=[3,12,10,9,4,1]; // High-ticket
  else if(c.cat==='Cars'||c.cat==='Space') pool=[6,13,11,3,1];
  else if(c.cat==='Tech'||c.cat==='Gaming') pool=[8,11,5,4,1];
  else if(c.cat==='Luxury'||c.cat==='Fashion') pool=[10,12,7,4,0];
  else if(tot<50) pool=[2,0,5,8,11]; // Quick tap / everyday
  else pool=[0,1,2,4,5,6,8,9,10,11,13];
  // 25% chance to pull from ANY of the 15 so every animation stays in active rotation
  if(Math.random()<0.25) return pick(CARD_ANIMS);
  return CARD_ANIMS[pick(pool)];
}

function commit(c,it,i,q,tot,msg,useCredit=false){
  if(useCredit){
    S.creditUsed=+(S.creditUsed+tot).toFixed(2);
    if(S.creditUsed/S.creditLimit>0.8) S.creditScore=Math.max(300,S.creditScore-4);
  }else{
    S.bal=+(S.bal-tot).toFixed(2);
  }
  S.spent+=tot;
  const k=c.id+'.'+i;
  S.inv[k]=(S.inv[k]||0)+q;
  if(it.f=='m')S.subs[k]=1;
  const d=Math.log10(tot+1)*3,ct=c.cat;
  if(ct=='Charity'){S.k+=d;S.karma+=d}
  else if(['Social','Luxury','Cars','Space','Sports'].includes(ct)||it.f=='a'){S.c+=d;S.h+=d/2}
  else S.h+=d;
  S.xp+=Math.round(Math.log10(tot+10)*10);
  S.rec.unshift({e:it.e,n:it.n+(useCredit?' [LOC]':''),s:c.n,q,tot,t:Date.now(),d:/[gsamh]/.test(it.f)});
  S.rec=S.rec.slice(0,150);
  setBal(-1);flt((useCredit?'💳 −':'−')+fmt(tot));sfxDing(260,.2,'triangle');
  if(it.f=='s'||it.f=='h'||it.f=='g')openLiveStudio(c,it,q,tot,msg);
  else if(it.f=='a')openViralAdSim(c,it,tot);
  else celebrate(c,it,q,tot);
  if(openCo)openStore(openCo);
  renderTabs();
  if(S.bal<1&&getAvailCredit()<10&&getNetWorth()<10)setTimeout(broke,2400);
}

function generateAuctionLots(){

    if(!/[mshag]/.test(it.f) && it.p>=500) pool.push({k:`${ci}.${ii}`,c,it});

    const shuffled=[...AI_BIDDERS].sort(()=>Math.random()-.5).slice(0,numBidders);

      rar,bidders:shuffled,curBid:startPrice,highBidder:shuffled[0].n,highAv:shuffled[0].av,
      youAreHigh:false,maxAiCap,
      history:[{who:shuffled[0].n,av:shuffled[0].av,amt:startPrice,t:Date.now()}]

  }
  auctionEnd=Date.now()+120000;
  if(!auctionLots.some(l=>l.id===selectedLotId)) selectedLotId=auctionLots[0]?.id||null;

function placePlayerBid(lotId,bidAmt){
  const lot=auctionLots.find(l=>l.id===lotId);
  if(!lot)return;
  if(bidAmt<=lot.curBid){toast('Bid must be higher than current bid!');return}
  if(bidAmt>S.bal){toast(`Need ${fmt(bidAmt)} cash in balance to bid!`);sfxTone(150,.2,'sawtooth');return}
  // Refund previous escrow if player was already high bidder, then escrow new bid
  if(lot.youAreHigh && lot.escrow) S.bal=+(S.bal+lot.escrow).toFixed(2);
  S.bal=+(S.bal-bidAmt).toFixed(2);
  lot.escrow=bidAmt;
  lot.curBid=bidAmt;
  lot.highBidder='YOU 👑';
  lot.highAv='😎';
  lot.youAreHigh=true;
  lot.history.unshift({who:'YOU 👑',av:'😎',amt:bidAmt,t:Date.now()});
  // Anti-snipe: if < 12s left, add 10s
  if(auctionEnd-Date.now()<12000) auctionEnd+=10000;
  setBal(-1);sfxDing(880,.12);toast(`🔨 Bid placed: ${fmt(bidAmt)} on ${lot.n}`);
  renderAuctions();
}

// ---------- Billing & Credit Cycle: every 20s ----------
setInterval(()=>{
  if(Date.now()>=next){
    next=Date.now()+20000;
    let delta=0;
    Object.keys(S.subs).forEach(k=>{
      const[c,it]=ITM(k);if(!it)return;
      if(S.bal<it.p){delete S.subs[k];toast(`⚠️ ${it.n} cancelled: insufficient cash`);return}
      S.bal=+(S.bal-it.p).toFixed(2);S.spent+=it.p;delta-=it.p;
      S.rec.unshift({e:'🔁',n:'Sub: '+it.n,s:c.n,q:1,tot:it.p,t:Date.now(),d:1});
    });
    let passive=0,upkeep=0;
    Object.keys(S.inv).forEach(k=>{
      const[,it]=ITM(k);
      if(it&&it.cf){const amt=it.cf*S.inv[k];if(amt>0)passive+=amt;else upkeep+=Math.abs(amt)}
    });
    S.prop.forEach(p=>{passive+=p.rent;upkeep+=p.tax;p.value*=1+propOf(p.pid).apprec});
    S.biz.forEach(b=>{if(b.dead||b.kind=='startup')return;const inc=b.income*(1+(b.staff||0)*.15+(b.rd||0)*.25);passive+=inc;upkeep+=b.upkeep+(b.staff||0)*b.staffPay});
    // Revolving Line of Credit interest & minimum payment
    if(S.creditUsed>0){
      const interest=+(S.creditUsed*S.apr).toFixed(2);
      S.creditUsed=+(S.creditUsed+interest).toFixed(2);
      const minPay=Math.min(S.creditUsed, Math.max(25, +(S.creditUsed*0.05).toFixed(2)));
      if(S.bal>=minPay){
        S.bal=+(S.bal-minPay).toFixed(2);
        S.creditUsed=+(S.creditUsed-minPay).toFixed(2);
        S.creditScore=Math.min(850,S.creditScore+3);
        delta-=minPay;
        S.rec.unshift({e:'💳',n:`LOC Min Payment (Score ${S.creditScore})`,s:'Credit Line',q:1,tot:minPay,t:Date.now(),d:1});
      }else{
        S.creditScore=Math.max(300,S.creditScore-8);
        toast('⚠️ Missed Line of Credit minimum payment! Credit score dropped.');
      }
    }
    if(passive>0){S.bal=+(S.bal+passive).toFixed(2);delta+=passive;S.rec.unshift({e:'📈',n:'Passive income & rent',s:'Portfolio',q:1,tot:-passive,t:Date.now(),d:1})}
    if(upkeep>0){const payUp=Math.min(S.bal,upkeep);S.bal=+(S.bal-payUp).toFixed(2);S.spent+=payUp;delta-=payUp;
      if(payUp>0)S.rec.unshift({e:'🧾',n:'Upkeep, taxes & payroll',s:'Operations',q:1,tot:payUp,t:Date.now(),d:1})}
    if(delta!==0){
      setBal(delta>0?1:-1);
      flt((delta>0?'+':'−')+fmt(Math.abs(delta)),delta>0);
      sfxDing(delta>0?660:330,.1);
      renderTabs();
    }
    save();
  }
  stats();
  if(tab=='a'&&!$('#a').hidden)renderAuctions();
  if(tab=='v'&&!$('#v').hidden)renderVentures();
  if(!$('#r').hidden)renderTabs();
},1000);

const cv=$('#fxc'),cx=cv.getContext('2d');
let DPR=1,VW=innerWidth,VH=innerHeight;
function resizeFX(){
  DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;
  cv.width=VW*DPR;cv.height=VH*DPR;

const FX={parts:[],ents:[],shake:0,flash:0,running:false,last:0,maxParts:1100};
const EMO_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif';
const cxX=()=>VW/2, cyY=()=>VH*.42;

function fxKick(){ if(!FX.running){FX.running=true;FX.last=performance.now();requestAnimationFrame(fxFrame)} }

function emit(o){
  if(FX.parts.length>FX.maxParts)return;
  FX.parts.push({x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,g:o.g??0,drag:o.drag??.985,
    life:o.life||1.6,age:0,sz:o.sz||28,ch:o.ch||null,col:o.col||null,rot:o.rot||0,vr:o.vr||0,
    kind:o.kind||'emoji',glow:o.glow||0,alpha:1});
}
function burst(x,y,o={}){
  const n=Math.round((o.n||24)),sp=o.speed||420;
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2),s=sp*rnd(.35,1);
    emit({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:o.g??260,drag:o.drag??.978,life:rnd(o.life?0.7*o.life:1.1,o.life||1.9),
      sz:rnd(o.sz?0.6*o.sz:16,o.sz||34),ch:o.chs?pick(o.chs):o.ch,col:o.col,kind:o.col&&!o.chs&&!o.ch?'spark':'emoji',vr:rnd(-6,6),glow:o.glow||0});
  }
}
function sparkRing(x,y,n,r,col,dur=1){
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    emit({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,vx:Math.cos(a)*110,vy:Math.sin(a)*110,g:-30,drag:.97,life:dur*rnd(.8,1.2),sz:rnd(3,6.5),col,kind:'spark',glow:14});
  }
}
function rain(chs,n,dur=3,o={}){
  for(let i=0;i<n;i++){
    const t=rnd(0,dur*.7);
    setTimeout(()=>emit({x:rnd(0,VW),y:-40,vx:rnd(-30,30),vy:rnd(120,260)*(o.speed||1),g:o.g??60,drag:.995,life:dur,sz:rnd(o.min||18,o.max||44),ch:o.col?null:pick(chs),col:o.col?pick(o.col):null,kind:o.col?'confetti':'emoji',rot:rnd(0,6),vr:rnd(-5,5)}),t*1000);

function rise(chs,n,dur=3,o={}){

const ease={
  out:t=>1-Math.pow(1-t,3),
  back:t=>1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2),
  inOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2
};
function fxFrame(now){
  const dt=Math.min(.05,(now-FX.last)/1000);FX.last=now;
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.clearRect(0,0,VW,VH);
  cx.save();
  if(FX.shake>.3)cx.translate(rnd(-FX.shake,FX.shake),rnd(-FX.shake,FX.shake));
  cx.textAlign='center';cx.textBaseline='middle';

  FX.ents=FX.ents.filter(en=>now<en.t0+en.dur+50);
  for(const en of FX.ents){
    const p=clamp((now-en.t0)/en.dur,0,1);
    if(now<en.t0)continue;
    if(en.type=='tint'){
      const a=p<.2?p/.2*en.peak:p>.7?(1-(p-.7)/.3)*en.peak:en.peak;
      cx.fillStyle=en.col.replace('A',(a).toFixed(3));
      cx.globalAlpha=1;cx.fillRect(-20,-20,VW+40,VH+40);
    }else if(en.type=='rays'){
      cx.save();cx.translate(cxX(),cyY());cx.rotate(p*Math.PI*1.35);

    }else if(en.type=='speedlines'){

    }else if(en.type=='orbit'){

      cx.shadowColor=en.col;cx.shadowBlur=26;

      cx.shadowBlur=0;cx.globalAlpha=1;

      else if(en.anim=='rise'){const q=ease.out(clamp(p/.4,0,1));dy=(1-q)*VH*.45;s=.6+.4*q;a=p>.85?1-(p-.85)/.15:1}
      else if(en.anim=='fly'){const q=ease.inOut(p);dy=-q*VH*.1;s=1;a=p>.9?1-(p-.9)/.1:1;r=Math.sin(p*Math.PI*2)*.15}
      else if(en.anim=='carlaunch'){

        if(p<.25){dx=(1-ease.out(p/.25))*VW*.65;s=0.85+0.25*(p/.25)}
        else if(p<.75){dx=Math.sin((p-.25)*24)*6;s=1.12}
        else{dx=-ease.inOut((p-.75)/.25)*VW*.75;s=1.18}
        a=p>.9?1-(p-.9)/.1:1;
      }
      else if(en.anim=='fade'){a=p<.2?p/.2:p>.8?1-(p-.8)/.2:1;s=1+p*.15}
      cx.save();cx.globalAlpha=clamp(a,0,1);cx.translate(en.x+dx,en.y+dy);cx.rotate(r);
      cx.font=`${en.size*s}px ${EMO_FONT}`;
      cx.shadowColor=en.glow||'rgba(255,220,120,.85)';cx.shadowBlur=en.glow===false?0:55*s;
      cx.fillText(en.e,0,0);cx.restore();
    }else if(en.type=='text'){
      const q=ease.back(clamp(p/.16,0,1)),a=p>.85?1-(p-.85)/.15:1;
      cx.save();cx.globalAlpha=clamp(a,0,1);cx.translate(en.x,en.y);cx.scale(.4+.6*q,.4+.6*q);
      cx.font=`900 ${en.size}px ui-rounded,system-ui,sans-serif`;cx.fillStyle=en.col;
      cx.shadowColor=en.glow;cx.shadowBlur=22;cx.fillText(en.txt,0,0);
      cx.restore();
    }

  FX.parts=FX.parts.filter(pt=>(pt.age+=dt)<pt.life&&pt.y<VH+200);
  for(const pt of FX.parts){
    pt.vy+=pt.g*dt;pt.vx*=Math.pow(pt.drag,dt*60);pt.vy*=Math.pow(pt.drag,dt*60);
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.rot+=pt.vr*dt;
    const life=pt.age/pt.life,a=life>.7?1-(life-.7)/.3:1;
    cx.globalAlpha=clamp(a,0,1);

      cx.fillStyle=pt.col;cx.shadowColor=pt.col;cx.shadowBlur=pt.glow||10;

      cx.fillRect(-pt.sz/2,-pt.sz/4,pt.sz,pt.sz/2);cx.restore();

      cx.save();cx.translate(pt.x,pt.y);cx.rotate(pt.rot);

      else cx.fillText(pt.ch,0,0);
      cx.restore();
    }
  }

  if(FX.parts.length||FX.ents.length||FX.flash>.01||FX.shake>.3)requestAnimationFrame(fxFrame);
  else FX.running=false;
}

let AC=null,MASTER=null,VERB=null;
function audio(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      MASTER=AC.createGain();MASTER.gain.value=.85;MASTER.connect(AC.destination);
      VERB=AC.createConvolver();
      const len=AC.sampleRate*2.6,buf=AC.createBuffer(2,len,AC.sampleRate);
      for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
      VERB.buffer=buf;const vg=AC.createGain();vg.gain.value=.4;VERB.connect(vg);vg.connect(MASTER);
    }catch(e){AC=null}
  }
  if(AC&&AC.state=='suspended')AC.resume();
  return AC;
}
function sfxTone(f,d,ty='sine',v=.15,at=0,f2,wet=0){
  const a=audio();if(!a)return;
  try{
    const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();
    o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.04,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(MASTER);if(wet)g.connect(VERB);
    o.start(t);o.stop(t+d+.05);
  }catch(e){}
}
function sfxNoise(d,v=.1,at=0,hz=1000,hz2,wet=0){
  const a=audio();if(!a)return;
  try{
    const t=a.currentTime+at,n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
    for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    s.buffer=b;f.frequency.setValueAtTime(hz,t);if(hz2)f.frequency.exponentialRampToValueAtTime(hz2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(MASTER);if(wet)g.connect(VERB);s.start(t);
  }catch(e){}
}
function sfxDing(f,t=.15,ty='sine'){sfxTone(f,t*3,ty,.1)}
function sfxTick(f){sfxTone(f,.05,'square',.04)}
function sfxRoar(at=0,len=1.8,vol=.35){
  const a=audio();if(!a)return;
  try{
    const t=a.currentTime+at;
    const out=a.createGain();out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(vol,t+.15);
    out.gain.linearRampToValueAtTime(vol*.8,t+len*.6);out.gain.exponentialRampToValueAtTime(.001,t+len);
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(700,t);lp.frequency.linearRampToValueAtTime(1400,t+len*.5);lp.frequency.linearRampToValueAtTime(500,t+len);
    const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=6;lg.gain.value=9;lfo.connect(lg);
    for(const det of [0,7,-9]){
      const o=a.createOscillator();o.type='sawtooth';
      o.frequency.setValueAtTime(140+det,t);o.frequency.linearRampToValueAtTime(92+det,t+len*.5);o.frequency.linearRampToValueAtTime(70+det,t+len);
      lg.connect(o.frequency);o.connect(lp);o.start(t);o.stop(t+len+.1);
    }
    const nz=a.createBufferSource(),nb=a.createBuffer(1,a.sampleRate*len|0,a.sampleRate),nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*.5;
    nz.buffer=nb;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900;bp.Q.value=1.2;
    const ng=a.createGain();ng.gain.value=.35;nz.connect(bp);bp.connect(ng);
    lp.connect(out);ng.connect(out);out.connect(MASTER);out.connect(VERB);
    lfo.start(t);lfo.stop(t+len+.1);nz.start(t);nz.stop(t+len);
  }catch(e){}
}
function sfxBoom(at=0,vol=.5){sfxTone(70,1.4,'sine',vol,at,28,.6);sfxNoise(1.1,vol*.5,at,600,60,.5)}
function sfxSparkle(at=0){[1568,2093,2637,3136].forEach((f,i)=>sfxTone(f,.25,'triangle',.05,at+i*.05,null,.8))}

function fireGift(c,it,q,tot){
  audio();
  const fn=GIFTS[it.n];
  if(fn){fn(c,it,q,tot);return}
  if(c.n=='YouTube')return ytGift(it,q,tot);
  if(c.n=='Twitch')return twGift(it,q,tot);
  return platformGift(c,it,q,tot);
}

function ytGift(it,q,tot){
  const col=tot>=500?'#ef4444':tot>=100?'#eab308':tot>=50?'#f97316':tot>=20?'#22c55e':'#0ea5e9';
  tint('rgba(0,0,0,A)',3400,.68);rays('rgba(255,0,0,.22)',3200,18,0);
  ring({col,w:10,dur:1300});hero(it.e,{size:200,anim:'pop',dur:3200,glow:col});
  burst(CX(),CY(),{col,n:42,speed:480,glow:14});rain(['💸','❤️','▶️'],Math.min(60,22+q),3.2);
  sfxFanfare(0);text(`SUPER CHAT ${fmt(tot)}`,{y:VH*.74,size:Math.min(44,VW/12),col:'#fde047',dur:2800});
}
function twGift(it,q,tot){
  tint('rgba(145,70,255,A)',4000,.6);shakeFX(12);
  hero(it.f=='h'?'🚂':'💎',{size:190,anim:it.f=='h'?'fly':'pop',dur:3400,glow:'#a855f7'});
  rain(['💜','💎','🚂','👑'],Math.min(60,24+q),3.4);
  sfxFanfare(0);text(`${multTxt(q)}${it.n}!`,{y:VH*.74,size:Math.min(42,VW/12),col:'#d8b4fe',dur:2800});
}
function platformGift(c,it,q,tot){
  tint(hexToRgba(c.c,.55),3600,1);ring({col:c.c,w:9,dur:1300});
  hero(it.e,{size:190,anim:'pop',dur:3400,glow:c.c});rain([it.e,'✨','🔥','💎','🎉'],Math.min(60,22+q),3.2);
  sfxFanfare(0);text(`${c.n}: ${multTxt(q)}${it.n}!`,{y:VH*.74,size:Math.min(40,VW/12),col:'#fff',dur:2800});
}
function hexToRgba(hex,a){
  const h=hex.replace('#','');const n=parseInt(h.length==3?h.split('').map(x=>x+x).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

      <span style="font-size:28px">${p.e}</span>
      <div><b>${p.n}</b>
        <small>${fmt(p.price)} · Rent +${fmt(p.rent)}/20s · Tax −${fmt(p.tax)}/20s</small></div>
      <button class="buy" data-buy-prop="${p.id}">Buy</button>
    </div>`).join('');
    body=`<div class="sec-h">Your Properties (${S.prop.length})</div>${owned||'<div class="empty">No properties yet. Buy below for passive rental income + appreciation.</div>'}<div class="sec-h">Real Estate Listings</div>${market}`;
  }else if(vSub=='biz'){
    const myBiz=S.biz.map((b,idx)=>{
      if(b.kind=='startup'){
        return `<div class="rec">
          <span style="font-size:28px">${b.e}</span>
          <div><b>${b.n} (${b.stage})</b>
            <small>${b.dead?'💥 Shut down':`Stake Value: ${fmt(b.val)} (Invested ${fmt(b.invested)}) · ${b.notes||'Awaiting next round'}`}</small></div>
          ${b.dead?`<button class="ghost" data-drop-biz="${idx}">Remove</button>`:`<button class="sell-btn" data-cash-startup="${idx}">Cash Out ${fmt(b.val)}</button>`}
        </div>`;
      }
      const net=b.income*(1+(b.staff||0)*.15+(b.rd||0)*.25)-b.upkeep-(b.staff||0)*b.staffPay;
      const rdCost=Math.round(b.cost*0.35);
      return `<div class="rec">
        <span style="font-size:28px">${b.e}</span>
        <div><b>${b.n} (Staff ${b.staff||0} · R&amp;D Lv.${b.rd||0})</b>
          <small>Net ${net>=0?'+':''}${fmt(net)}/20s · Valuation ${fmt(b.val)}</small></div>
        <button class="ghost" data-hire="${idx}">+Staff (${fmt(b.staffPay)})</button>
        <button class="ghost" data-rd="${idx}">🧪 R&amp;D (${fmt(rdCost)})</button>
        <button class="sell-btn" data-sell-biz="${idx}">Sell ${fmt(b.val)}</button>
      </div>`;
    }).join('');
    const shops=BIZ_TYPES.map(b=>`<div class="rec">
      <span style="font-size:28px">${b.e}</span>
      <div><b>${b.n}</b><small>Buy ${fmt(b.cost)} · Base net +${fmt(b.income-b.upkeep)}/20s</small></div>
      <button class="buy" data-open-biz="${b.id}">Launch</button>
    </div>`).join('');
    const angels=STARTUPS.map(s=>`<div class="rec">
      <span style="font-size:28px">${s.e}</span>
      <div><b>${s.n} · ${s.stage}</b><small>Risk: ${s.risk} · Potential ${s.mult[0]}×–${s.mult[1]}× (rounds every 60s)</small></div>
      <div class="qbtns" style="margin:0">
        <button data-angel="${s.id}|25000">$25k</button>
        <button data-angel="${s.id}|100000">$100k</button>
        <button data-angel="${s.id}|500000">$500k</button>
      </div>
    </div>`).join('');
    body=`<div class="sec-h">Your Companies &amp; Stakes (${S.biz.length})</div>${myBiz||'<div class="empty">No active businesses or angel stakes yet.</div>'}<div class="sec-h">Launch Operating Business</div>${shops}<div class="sec-h">Angel Startup Deals</div>${angels}`;
  }else if(vSub=='games'){
    body=`
      <div class="sec-h">🎰 High-Stakes Executive Mini-Games (Instant Cash &amp; XP)</div>
      <div class="rec">
        <span style="font-size:32px">🎡</span>
        <div><b>Executive Vault Roulette</b><small>Spin the Swiss Vault Wheel: 45% chance for <b>2.1× Payout</b>, 10% Jackpot <b>5× Payout</b>!</small></div>
        <div class="qbtns" style="margin:0">
          <button class="buy" data-game="wheel|5000">Bet $5k</button>
          <button class="buy" data-game="wheel|50000">Bet $50k</button>
          <button class="buy" data-game="wheel|500000">Bet $500k</button>
        </div>
      </div>
      <div class="rec">
        <span style="font-size:32px">🎲</span>
        <div><b>Venture Pitch Dice (Roll 8+ on 2d6)</b><small>Beat the VC Syndicate with a roll of 8 or higher to win <b>2.4× your stake</b>!</small></div>
        <div class="qbtns" style="margin:0">
          <button class="buy" data-game="dice|10000">Stake $10k</button>
          <button class="buy" data-game="dice|100000">Stake $100k</button>
          <button class="buy" data-game="dice|1000000">Stake $1M</button>
        </div>
      </div>
      <div class="rec">
        <span style="font-size:32px">📈</span>
        <div><b>60-Second Options Binary Call (Bull vs Bear)</b><small>Call the instant market tick direction for an immediate <b>1.95× return</b>!</small></div>
        <div class="qbtns" style="margin:0">
          <button class="buy" data-game="bull|25000">🟢 Bull $25k</button>
          <button class="ghost" data-game="bear|25000">🔴 Bear $25k</button>
          <button class="buy" data-game="bull|250000">🟢 Bull $250k</button>
        </div>
      </div>`;
  }

  $('#v').innerHTML=top+body;

  $('#v').querySelectorAll('[data-vs]').forEach(b=>b.onclick=()=>{vSub=b.dataset.vs;renderVentures()});
  $('#v').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const[t,qn]=b.dataset.buy.split('|'),x=tickerOf(t);if(!x)return;
    const q=qn=='max'?Math.floor(S.bal/x.p):+qn;
    if(q<1){toast('Not enough cash for 1 share');return}
    const cost=+(q*x.p).toFixed(2);
    if(!spendVenture(cost,'📈',`Bought ${q} ${t} @ ${fmt(x.p)}`,'Stock Market'))return;
    const cur=S.stk[t]||{q:0,avg:0};
    S.stk[t]={q:cur.q+q,avg:(cur.q*cur.avg+cost)/(cur.q+q)};
    save();renderVentures();toast(`Bought ${q} ${t}`);
  });
  $('#v').querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{
    const[t,mode]=b.dataset.sell.split('|'),x=tickerOf(t),cur=S.stk[t];
    if(!x||!cur||cur.q<1)return;
    const q=mode=='half'?Math.max(1,Math.floor(cur.q/2)):cur.q;
    const proceeds=+(q*x.p).toFixed(2);
    cur.q-=q;if(cur.q<=0)delete S.stk[t];
    earn(proceeds,'💵',`Sold ${q} ${t} @ ${fmt(x.p)}`,'Stock Market');
    renderVentures();toast(`Sold ${q} ${t} for ${fmt(proceeds)}`);
  });
  $('#v').querySelectorAll('[data-buy-prop]').forEach(b=>b.onclick=()=>{
    const p=propOf(b.dataset.buyProp);if(!p)return;
    if(!spendVenture(p.price,p.e,p.n,'Real Estate'))return;
    S.prop.push({pid:p.id,paid:p.price,value:p.price,rent:p.rent,tax:p.tax,reno:0});
    celebrateRaw(p.e,`Purchased ${p.n}!`);renderVentures();
  });
  $('#v').querySelectorAll('[data-reno-prop]').forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.renoProp,p=S.prop[idx];if(!p)return;
    const cost=Math.round(p.value*0.18);
    if(!spendVenture(cost,'🔨',`Renovated ${propOf(p.pid).n}`,'Real Estate'))return;
    p.reno=(p.reno||0)+1;p.value=Math.round(p.value*1.24);p.rent=Math.round(p.rent*1.35);
    save();renderVentures();toast(`⭐ Property upgraded! Rent boosted +35% to ${fmt(p.rent)}/20s`);
  });
  $('#v').querySelectorAll('[data-sell-prop]').forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.sellProp,p=S.prop[idx];if(!p)return;
    S.prop.splice(idx,1);
    earn(p.value,'🏠',`Sold ${propOf(p.pid).n}`,'Real Estate');
    renderVentures();toast(`Sold property for ${fmt(p.value)}`);
  });
  $('#v').querySelectorAll('[data-open-biz]').forEach(b=>b.onclick=()=>{
    const bt=bizOf(b.dataset.openBiz);if(!bt)return;
    if(!spendVenture(bt.cost,bt.e,`Launched ${bt.n}`,'Ventures'))return;
    S.biz.push({kind:'op',bid:bt.id,n:bt.n,e:bt.e,cost:bt.cost,val:bt.cost*.85,income:bt.income,upkeep:bt.upkeep,staffPay:bt.staffPay,staff:0,rd:0});
    celebrateRaw(bt.e,`Opened ${bt.n}!`);renderVentures();
  });
  $('#v').querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>{
    const bz=S.biz[+b.dataset.hire];if(!bz)return;
    if(!spendVenture(bz.staffPay,'👔',`Hired staff at ${bz.n}`,'Ventures'))return;
    bz.staff=(bz.staff||0)+1;bz.val+=bz.staffPay*2;
    save();renderVentures();toast(`Hired staff (+15% revenue)`);
  });
  $('#v').querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{
    const bz=S.biz[+b.dataset.rd];if(!bz)return;
    const cost=Math.round(bz.cost*0.35);
    if(!spendVenture(cost,'🧪',`R&D Upgrade at ${bz.n}`,'Ventures'))return;
    bz.rd=(bz.rd||0)+1;bz.val+=Math.round(cost*1.3);
    save();renderVentures();toast(`🧪 R&D Level ${bz.rd} unlocked (+25% revenue)!`);
  });
  $('#v').querySelectorAll('[data-sell-biz]').forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.sellBiz,bz=S.biz[idx];if(!bz)return;
    S.biz.splice(idx,1);
    earn(bz.val,bz.e,`Sold ${bz.n}`,'Ventures');
    renderVentures();toast(`Sold ${bz.n} for ${fmt(bz.val)}`);
  });
  $('#v').querySelectorAll('[data-angel]').forEach(b=>b.onclick=()=>{
    const[id,amtS]=b.dataset.angel.split('|'),s=stupOf(id),amt=+amtS;
    if(!s||!spendVenture(amt,s.e,`Angel stake in ${s.n}`,'Startups'))return;
    S.biz.push({kind:'startup',sid:s.id,n:s.n,e:s.e,stage:s.stage,win:s.win,mult:s.mult,invested:amt,val:amt,notes:'Seed round closed'});
    celebrateRaw(s.e,`Backed ${s.n}!`);renderVentures();
  });
  $('#v').querySelectorAll('[data-cash-startup]').forEach(b=>b.onclick=()=>{
    const idx=+b.dataset.cashStartup,bz=S.biz[idx];if(!bz||bz.dead)return;
    S.biz.splice(idx,1);
    earn(bz.val,bz.e,`Exited ${bz.n}`,'Startups');
    renderVentures();toast(`Exited ${bz.n} for ${fmt(bz.val)}`);
  });
  $('#v').querySelectorAll('[data-drop-biz]').forEach(b=>b.onclick=()=>{
    S.biz.splice(+b.dataset.dropBiz,1);save();renderVentures();
  });

  // Mini-games execution
  $('#v').querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{
    const[gType,betS]=b.dataset.game.split('|'),bet=+betS;
    if(!spendVenture(bet,'🎲',`Mini-Game Wager (${gType.toUpperCase()})`,'Executive Games'))return;
    if(gType==='wheel'){
      const r=Math.random();
      if(r<0.10){const win=bet*5;earn(win,'👑','VAULT JACKPOT 5×!','Executive Games');celebrateRaw('👑',`5× JACKPOT! +${fmt(win)}`,'#fde047')}
      else if(r<0.55){const win=Math.round(bet*2.1);earn(win,'🎡','Vault Roulette Win (2.1×)','Executive Games');toast(`🎡 Vault hit! Won ${fmt(win)}!`)}
      else{toast('🎡 Vault missed! Better luck next spin.');sfxTone(180,.25,'sawtooth')}
    }else if(gType==='dice'){
      const d1=Math.ceil(Math.random()*6),d2=Math.ceil(Math.random()*6),sum=d1+d2;
      if(sum>=8){const win=Math.round(bet*2.4);earn(win,'🎲',`Rolled ${d1}+${d2}=${sum} (2.4× Win!)`,'Executive Games');toast(`🎲 Rolled ${sum}! Won ${fmt(win)}!`)}
      else{toast(`🎲 Rolled ${d1}+${d2}=${sum} (Needed 8+). Lost ${fmt(bet)}.`);sfxTone(180,.25,'sawtooth')}
    }else{
      const won=Math.random()<0.52;
      if(won){const win=Math.round(bet*1.95);earn(win,'📈',`Options Call Hit! (1.95×)`,'Executive Games');toast(`📈 Market moved your way! Won ${fmt(win)}!`)}
      else{toast(`📉 Market reversed! Options expired.`);sfxTone(180,.25,'sawtooth')}
    }
    renderVentures();
  });
}

// ---------- My stuff, Credit Line Center, & Receipts ----------
function renderTabs(){
  S.creditLimit=getDynamicCreditLimit();
  const utilPct=S.creditLimit>0?Math.min(100,(S.creditUsed/S.creditLimit)*100):0;

  const creditPanel=`
    <div class="sec-h">💳 Revolving Line of Credit &amp; Credit Bureau</div>
    <div class="rec" style="flex-direction:column;align-items:stretch;gap:10px">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div><b style="font-size:16px">Credit Score: <span class="good">${S.creditScore}</span> / 850</b>
          <small>Limit scales automatically with your Net Worth · APR ${(S.apr*100).toFixed(1)}%/20s</small></div>
        <div style="text-align:right">
          <b>Used: <span class="${S.creditUsed>0?'bad':'good'}">${fmt(S.creditUsed)}</span> / ${fmt(S.creditLimit)}</b>
          <small>Available Credit: <b>${fmt(getAvailCredit())}</b></small>
        </div>
      </div>
      <div class="meter" style="min-width:100%"><i style="width:${utilPct}%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad))"></i></div>
      <div class="qbtns" style="margin:0">
        <button class="buy" id="payLoc25" ${S.creditUsed<=0?'disabled':''}>Pay 25% (${fmt(S.creditUsed*0.25)})</button>
        <button class="buy" id="payLocAll" ${S.creditUsed<=0?'disabled':''}>Pay Off Full Balance (${fmt(S.creditUsed)})</button>
        <button class="ghost" id="boostCreditBtn">📈 Request Limit Increase</button>
      </div>
    </div>`;

  const subs=Object.keys(S.subs).map(k=>{
    const[c,it]=ITM(k);if(!it)return'';
    return `<div class="rec"><span>${it.e}</span><div><b>${it.n}</b><small>${c.n} · ${fmt(it.p)}/20s</small></div><button class="ghost" data-k="${k}">Cancel</button></div>`;
  }).join('');

  const items=Object.keys(S.inv).map(k=>{
    const[c,it]=ITM(k);if(!it)return'';
    const q=S.inv[k],isAsset=!/[mshag]/.test(it.f),resale=+(it.p*0.7).toFixed(2);
    const cfTxt=it.cf>0?` · +${fmt(it.cf*q)}/20s`:it.cf<0?` · −${fmt(Math.abs(it.cf)*q)}/20s`:'';
    return `<div class="rec"><span>${it.e}</span><div><b>${it.n} ×${q.toLocaleString()}</b><small>${c.n} · Paid ${fmt(it.p*q)}${cfTxt}</small></div>
      ${isAsset?`<button class="sell-btn" data-sell-item="${k}">Quick Sell 1 (${fmt(resale)})</button>`:''}</div>`;
  }).join('');

  $('#m').innerHTML=creditPanel+
    `<div class="sec-h">Active Subscriptions</div>${subs||'<div class="empty">No active subscriptions</div>'}`+
    `<div class="sec-h">Owned Assets &amp; Inventory (Resell at 70% or Auction in Auction House)</div>${items||'<div class="empty">Nothing owned yet — go spend!</div>'}`;

  if($('#payLoc25'))$('#payLoc25').onclick=()=>{
    const amt=Math.min(S.bal, +(S.creditUsed*0.25).toFixed(2));
    if(amt<=0){toast('Not enough cash to pay down credit');return}
    S.bal=+(S.bal-amt).toFixed(2);S.creditUsed=+(S.creditUsed-amt).toFixed(2);
    S.creditScore=Math.min(850,S.creditScore+5);
    setBal(-1);renderTabs();toast(`💳 Paid ${fmt(amt)} toward Line of Credit! Credit Score +5`);
  };
  if($('#payLocAll'))$('#payLocAll').onclick=()=>{
    const amt=Math.min(S.bal, S.creditUsed);
    if(amt<=0){toast('Not enough cash');return}
    S.bal=+(S.bal-amt).toFixed(2);S.creditUsed=+(S.creditUsed-amt).toFixed(2);
    S.creditScore=Math.min(850,S.creditScore+12);
    setBal(-1);renderTabs();toast(`🎉 Paid ${fmt(amt)}! Credit Score rose to ${S.creditScore}`);
  };
  if($('#boostCreditBtn'))$('#boostCreditBtn').onclick=()=>{
    S.creditLimit=getDynamicCreditLimit();save();renderTabs();
    toast(`🏦 Credit limit refreshed to ${fmt(S.creditLimit)} based on Net Worth!`);
  };

  $('#m').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    delete S.subs[b.dataset.k];save();renderTabs();toast('Subscription cancelled');
  });
  $('#m').querySelectorAll('[data-sell-item]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.sellItem,[c,it]=ITM(k);if(!it)return;
    const refund=+(it.p*0.7).toFixed(2);
    S.inv[k]--;if(S.inv[k]<=0)delete S.inv[k];
    S.bal=+(S.bal+refund).toFixed(2);
    S.rec.unshift({e:'🏷️',n:'Sold: '+it.n,s:c.n,q:1,tot:-refund,t:Date.now(),d:1});
    setBal(1);flt('+'+fmt(refund),1);sfxDing(660,.15);renderTabs();toast(`Sold ${it.n} for ${fmt(refund)}`);
  });

  $('#r').innerHTML=S.rec.map(x=>{
    const gain=x.tot<0;
    return `<div class="rec"><span>${x.e}</span><div><b>${x.n}</b><small>${x.s}${x.q>1?' · ×'+x.q.toLocaleString():''} · ${new Date(x.t).toLocaleTimeString('en-CA')}</small></div>
    <b class="${gain?'good':''}">${gain?'+'+fmt(Math.abs(x.tot)):fmt(x.tot)}</b></div>`;
  }).join('')||'<div class="empty">No transactions yet</div>';
}
</script>
</body>
