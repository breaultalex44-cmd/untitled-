function stats(){const mo=Object.keys(S.subs).reduce((a,k)=>a+ITM(k)[1].p,0),r=RANKS.filter(x=>S.spent>=x[0]).pop()[1];
 $('#st').innerHTML=`<span>🏅 ${S.bal<1?'Broke legend':r}</span><span>😊 ${Math.round(S.h)}</span><span>📣 ${Math.round(S.c)}</span><span>💖 ${Math.round(S.k)}</span><span>🔁 ${fmt(mo)}/mo · ${mo?Math.max(0,Math.ceil((next-Date.now())/1000))+'s':'no subs'}</span>`}
const show=(id,h)=>{const e=$('#'+id);e.innerHTML=h;e.className='layer on';return e},cls=id=>{const e=$('#'+id);e.className='layer';e.innerHTML=''};
['ov','lay'].forEach(id=>$('#'+id).onclick=e=>{if(e.target.id==id){cls(id);if(id=='ov')openCo=null}});
// ---- store browsing
function grid(){const q=$('#q').value.toLowerCase();$('#gr').innerHTML='';CO.filter(c=>(cat=='All'||c.cat==cat)&&(c.n.toLowerCase().includes(q)||c.it.some(i=>i.n.toLowerCase().includes(q)))).forEach(c=>{const b=document.createElement('button');b.className='co';b.innerHTML=`<div class="lg" style="background:${c.c}33">${c.e}</div><b>${c.n}</b><small>${c.cat} · ${c.it.length} items</small>`;b.onclick=()=>openStore(c);$('#gr').append(b)})}
function chips(){const cs=['All',...new Set(CO.map(c=>c.cat))];$('#ch').innerHTML='';cs.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=c==cat?'on':'';b.onclick=()=>{cat=c;chips();grid()};$('#ch').append(b)})}
function openStore(c){openCo=c;const e=show('ov',`<div class="sheet"><div class="sh" style="background:${c.c}"><i>${c.e}</i><div><b style="font-size:20px">${c.n}</b><br>${c.cat}</div><button>✕</button></div></div>`);e.querySelector('button').onclick=()=>{cls('ov');openCo=null};
 c.it.forEach((it,i)=>{const r=document.createElement('div'),own=S.inv[c.id+'.'+i],sub=S.subs[c.id+'.'+i];r.className='row';
  r.innerHTML=`<span>${it.e}</span><div><b>${it.n}</b><small>${fmt(it.p)}${{m:' per month 🔁',s:' · live Super Chat 💬',g:' · animated gift ✨',h:' · hype train 🚂',a:' · ad campaign 📈'}[it.f]||''}${own&&!sub?' · you own '+own:''}</small></div><button class="buy">${sub?'Subscribed ✓':'Buy'}</button>`;
  const b=r.querySelector('button');b.disabled=!!sub;b.onclick=()=>checkout(c,it,i);e.querySelector('.sheet').append(r)})}
// ---- checkout + payment animation
function checkout(c,it,i){let q=1;const one=it.f=='m'||it.f=='s',max=Math.max(1,Math.min(1e5,Math.floor(S.bal/it.p)));
 const e=show('ck',`<div class="sheet"><div class="ckb"><h3>${it.e} ${it.n}</h3><small style="color:var(--mut)">${c.n}</small>
 ${one?'':'<div class="qty"><button>−</button><b id="qn">1</b><button>+</button><button data-q="10">×10</button><button data-q="100">×100</button><button data-q="max">Max</button></div>'}
 ${it.f=='s'?'<input type="text" id="msg" maxlength="120" placeholder="Your message, read live on stream 💬" style="margin-top:10px">':''}
 <div class="card" id="cd"><div>•••• •••• •••• 4242</div><small>YOU · 12/29</small></div>
 <div class="tot"><span>Total</span><span id="tt2"></span></div><div class="stat" id="stt"></div><button class="pay" id="pay"></button></div></div>`);
 const upd=()=>{q=Math.max(1,Math.min(1e6,q));$('#tt2').textContent=fmt(q*it.p);$('#pay').textContent='Pay '+fmt(q*it.p);if($('#qn'))$('#qn').textContent=q.toLocaleString()};upd();
 e.querySelectorAll('.qty button').forEach((b,n)=>b.onclick=()=>{const d=b.dataset.q;q=d?(d=='max'?max:q*+d):q+(n?1:-1);upd()});
 e.onclick=ev=>{if(ev.target.id=='ck'&&!busy)cls('ck')};
 $('#pay').onclick=async()=>{busy=true;$('#pay').disabled=true;$('#cd').classList.add('busy');const tot=+(q*it.p).toFixed(2),msg=$('#msg')?$('#msg').value.trim():'';
  for(const s of ['🔒 Encrypting card details…','🏦 Contacting your bank…','🧾 Authorizing '+fmt(tot)+'…']){$('#stt').textContent=s;ding(500+Math.random()*200,.05);await wait(650)}
  const ok=tot<=S.bal+1e-9,sh=e.querySelector('.sheet');
  sh.innerHTML=ok?`<div class="res ok"><svg viewBox="0 0 100 100" stroke="currentColor"><circle cx="50" cy="50" r="30"/><path d="M36 51l10 10 19-21"/></svg><h2>Payment confirmed</h2><p><b>${fmt(tot)}</b> · ${c.n}</p><p>Auth AUTH-${Math.random().toString(36).slice(2,8).toUpperCase()}</p></div>`:`<div class="res no"><svg viewBox="0 0 100 100" stroke="currentColor"><circle cx="50" cy="50" r="30"/><path d="M40 40l20 20M60 40L40 60"/></svg><h2>Card declined</h2><p>Insufficient funds. You have ${fmt(S.bal)}.</p></div>`;
  if(ok){ding(880,.12);setTimeout(()=>ding(1320,.2),140)}else ding(150,.3,'sawtooth');
  await wait(ok?1400:1900);busy=false;cls('ck');if(ok)commit(c,it,i,q,tot,msg)}}
function commit(c,it,i,q,tot,msg){S.bal=+(S.bal-tot).toFixed(2);S.spent+=tot;const k=c.id+'.'+i;S.inv[k]=(S.inv[k]||0)+q;if(it.f=='m')S.subs[k]=1;
 const d=Math.log10(tot+1)*3,ct=c.cat;if(ct=='Charity')S.k+=d;else if(['Social','Luxury','Cars','Space'].includes(ct)||it.f=='a')S.c+=d,S.h+=d/2;else S.h+=d;
 S.rec.unshift({e:it.e,n:it.n,s:c.n,q,tot,t:Date.now(),d:/[gsamh]/.test(it.f)});S.rec=S.rec.slice(0,80);
 setBal(true);flt('−'+fmt(tot));ding(260,.2,'triangle');
 if(it.f=='s')superchat(tot,msg);else if(it.f=='a')adcamp(c,it,tot);
 else burst(it.e,q,tot,it.f=='g'?`Sent ${q.toLocaleString()}× ${it.n}!`:it.f=='h'?`🚂 HYPE TRAIN · ${it.n}`:it.f=='m'?`Subscribed: ${c.n}`:`${it.n} ordered!`);
 if(openCo)openStore(openCo);renderTabs();if(S.bal<1)setTimeout(broke,2500)}
// ---- effects
function burst(e,q,tot,label){const f=$('#fx'),n=Math.min(70,10+Math.round(Math.log10(tot+1)*9)+Math.min(q,15));
 if(label)f.insertAdjacentHTML('beforeend',`<div class="ban"><i>${e}</i><span>${label}</span></div>`);
 if(tot>=50000){f.insertAdjacentHTML('beforeend','<div class="flash"></div>');document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),600)}
 for(let i=0;i<n;i++){const p=document.createElement('s');p.textContent=Math.random()<.2?'💸':e;p.style.cssText=`left:${rnd(0,95)}%;font-size:${rnd(16,44)}px;animation-delay:${rnd(0,.9)}s;animation-duration:${rnd(1.6,3.2)}s`;f.append(p)}
 setTimeout(()=>{f.innerHTML=''},4400)}
function superchat(tot,msg){const th=[5,10,20,50,100,200,500],cl=['#1e88e5','#00bcd4','#1de9b6','#f9a825','#f57c00','#e91e63','#e62117'],c=cl[Math.min(6,th.filter(x=>tot>=x).length)],
 U=['xX_Gamer','mochi','TheRealBob','kayla_k','NightOwl','lofi_girl_fan','Dave'],M=['LETS GOOO','W stream','first time here','😂😂😂','clip it!!','POG','hello from Canada 🍁'];
 const e=show('lay',`<div class="live"><div class="vid"><em>● LIVE · ${Math.round(rnd(12,90))}.${Math.round(rnd(0,9))}K watching</em><span>🎙️</span></div><div class="chat" id="chat"></div><div id="scs"></div><div class="rx" id="rx"></div></div>`);
 const chat=$('#chat'),line=(u,m)=>{chat.insertAdjacentHTML('beforeend',`<div><b>${u}</b> ${m}</div>`);if(chat.children.length>8)chat.firstChild.remove()};
 const iv=setInterval(()=>line(U[~~rnd(0,7)],M[~~rnd(0,7)]),350);
 setTimeout(()=>{$('#scs').innerHTML=`<div class="sc" style="--c:${c}"><div>🧑 You · ${fmt(tot)}</div><div class="m"></div><u></u></div>`;$('#scs .m').textContent=msg||'';burst('❤️',1,tot,'');ding(988,.2);
  ['SUPERCHAT KING 👑','WHO IS THIS GUY','💸💸💸','THANK YOU SO MUCH','bro is rich'].forEach((m,i)=>setTimeout(()=>line(U[i],m),i*220));
  const t=`Oh wow, a ${fmt(tot)} Super Chat from You!! ${msg?'They say: “'+msg+'” — THANK YOU!!':'Thank you so much!!'}`;let n=0;const ty=setInterval(()=>{$('#rx').textContent='🎙️ '+t.slice(0,++n);if(n>=t.length)clearInterval(ty)},30)},1400);
 setTimeout(()=>{clearInterval(iv);cls('lay')},9500)}
function adcamp(c,it,tot){const imp=Math.round(tot/8*1000*rnd(.8,1.2)),clk=Math.round(imp*rnd(.012,.025)),sal=Math.round(clk*rnd(.02,.06));S.imp+=imp;S.c+=Math.log10(imp+1)*2;
 const e=show('lay',`<div class="sheet"><div class="res"><div style="font-size:54px">📢</div><h2>Campaign is live!</h2><p>${c.n} · ${it.n}</p><div class="cnt"><div><b data-v="${imp}">0</b><small>Impressions</small></div><div><b data-v="${clk}">0</b><small>Clicks</small></div><div><b data-v="${sal}">0</b><small>Sales</small></div></div><div class="pb"><i></i></div><p style="margin-top:12px">Reach is added to My stuff. Tap outside to close.</p></div></div>`);
 const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/3000);e.querySelectorAll('[data-v]').forEach(b=>b.textContent=Math.round(b.dataset.v*(1-Math.pow(1-k,3))).toLocaleString());if(k<1)requestAnimationFrame(s)})(t0);ding(660,.1);renderTabs()}
function broke(){show('lay',`<div class="sheet"><div class="res"><div style="font-size:60px">🪦</div><h2>You’re broke!</h2><p>You turned ${fmt(START)} into memories and receipts.</p><p>Fortune spent: ${fmt(S.spent)}</p><br><button class="pay" onclick="reset()">Start over with $1,000,000</button></div></div>`)}
// ---- tabs
function renderTabs(){const inv=Object.keys(S.inv),subs=Object.keys(S.subs);
 $('#m').innerHTML=`<div class="rec"><div><b style="color:var(--ink)">📊 Impact</b><small>😊 happiness ${Math.round(S.h)} · 📣 clout ${Math.round(S.c)} · 💖 karma ${Math.round(S.k)} · ad impressions ${S.imp.toLocaleString()} · total spent ${fmt(S.spent)}</small></div></div>`+(subs.length?'<h3>Subscriptions (billed every 20 seconds)</h3>':'')+subs.map(k=>{const[c,it]=ITM(k);return`<div class="rec"><span>${it.e}</span><div>${it.n}<small>${c.n} · ${fmt(it.p)}/mo</small></div><button class="buy" data-k="${k}">Cancel</button></div>`}).join('')+'<h3>Everything you own</h3>'+(inv.length?inv.map(k=>{const[c,it]=ITM(k);return`<div class="rec"><span style="font-size:24px">${it.e}</span><div>${it.n}<small>${c.n}</small></div><b style="color:var(--ink)">×${S.inv[k].toLocaleString()}</b></div>`}).join(''):'<div class="empty">Nothing yet. Open a store and spend something.</div>');
 $('#m').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{delete S.subs[b.dataset.k];save();stats();renderTabs();toast('Subscription cancelled')});
 const now=Date.now();$('#r').innerHTML=S.rec.length?S.rec.map(r=>{const s=(now-r.t)/1000,st=r.d?'⚡ Delivered instantly':s<8?'📦 Order placed':s<16?'🚚 Out for delivery':'✅ Delivered';return`<div class="rec"><span style="font-size:24px">${r.e}</span><div>${r.q>1?r.q.toLocaleString()+'× ':''}${r.n}<small>${r.s} · ${new Date(r.t).toLocaleTimeString()} · ${st}</small></div><b>−${fmt(r.tot)}</b></div>`}).join(''):'<div class="empty">No receipts yet.</div>'}
document.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs [data-t]').forEach(x=>x.className=x==b?'on':'');['s','m','r'].forEach(i=>$('#'+i).hidden=i!=b.dataset.t);renderTabs()});
let rc=0;$('#rs').onclick=()=>{if(rc){reset();return}rc=1;$('#rs').textContent='Tap again to reset';setTimeout(()=>{rc=0;$('#rs').textContent='Reset'},3000)};
function reset(){S={bal:START,spent:0,inv:{},subs:{},rec:[],h:0,c:0,k:0,imp:0};rc=0;$('#rs').textContent='Reset';cls('lay');setBal();renderTabs();if(openCo)openStore(openCo);toast('Fresh $1,000,000. Spend wisely, or don’t.')}
// ---- monthly billing + clock
setInterval(()=>{if(Date.now()>=next){next=Date.now()+20000;Object.keys(S.subs).forEach(k=>{const[c,it]=ITM(k);if(S.bal<it.p){delete S.subs[k];toast(`${it.n} cancelled: insufficient funds`);return}
 S.bal=+(S.bal-it.p).toFixed(2);S.spent+=it.p;S.rec.unshift({e:'🔁',n:'Billing: '+it.n,s:c.n,q:1,tot:it.p,t:Date.now(),d:1});setBal(true);flt('−'+fmt(it.p));toast(`🔁 ${c.n} billed ${fmt(it.p)}`);ding(330,.1)});renderTabs()}stats();if(!$('#r').hidden)renderTabs()},1000);
$('#q').oninput=grid;chips();grid();renderTabs();$('#bal').textContent=fmt(shown);setBal();
</script></body></html>
